<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desko — 锁屏</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-app: #f4f7f5;
    --bg-surface: #ffffff;
    --border-base: #dce3df;
    --border-card: #e1e8e3;
    --text-main: #0f1713;
    --text-dim: #7d9185;
    --brand: #216747;
    --brand-hover: #195237;
  }

  html, body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    background: var(--bg-app);
    color: var(--text-main);
    user-select: none;
    overflow: hidden;
  }

  /* ---- 解锁输入区：focus 仅换色 + 弥散光晕，边框恒为 1px ---- */
  .unlock-field {
    background: var(--bg-surface);
    border: 1px solid var(--border-base);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .unlock-field:focus-within {
    border-color: var(--brand);           /* 物理粗细保持 1px */
    box-shadow: 0 0 0 3px rgba(33, 103, 71, 0.08);
  }
  .unlock-field input {
    background: transparent;
    outline: none;
    border: none;
    color: var(--text-main);
  }
  .unlock-field input::placeholder { color: #a6b5ab; }

  /* ---- 提交按钮 ---- */
  .submit-btn { background: var(--brand); transition: background .15s ease, transform .1s ease; }
  .submit-btn:hover { background: var(--brand-hover); }
  .submit-btn:active { transform: scale(0.94); }

  /* ---- 报错微震动 ---- */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%      { transform: translateX(-4px); }
    40%      { transform: translateX(4px); }
    60%      { transform: translateX(-3px); }
    80%      { transform: translateX(2px); }
  }
  .shake { animation: shake 0.35s ease; }
  /* ---- 窗体控件 ---- */
  .cap-btn {
    width: 46px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    color: #8a9a90;
    transition: background .12s ease, color .12s ease;
  }
  .cap-btn:hover { background: rgba(15, 23, 19, 0.05); color: var(--text-main); }
  .cap-btn.close:hover { background: #e81123; color: #ffffff; }
</style>
</head>
<body>

<!-- 右上角系统窗体控件 -->
<div class="fixed top-0 right-0 flex items-center" style="height:38px;">
  <button class="cap-btn" title="最小化" aria-label="最小化">
    <svg width="11" height="11" viewBox="0 0 11 11"><path d="M1 5.5h9" stroke="currentColor" stroke-width="1.1"/></svg>
  </button>
  <button class="cap-btn" title="最大化" aria-label="最大化">
    <svg width="11" height="11" viewBox="0 0 11 11"><rect x="1.5" y="1.5" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.1" rx="1"/></svg>
  </button>
  <button class="cap-btn close" title="关闭" aria-label="关闭">
    <svg width="11" height="11" viewBox="0 0 11 11"><path d="M1.5 1.5l8 8M9.5 1.5l-8 8" stroke="currentColor" stroke-width="1.1"/></svg>
  </button>
</div>

<!-- 中心容器：定宽 300px，垂直居中微偏上（中心约在视口高度 42%） -->
<div class="w-full h-screen flex items-center justify-center">
  <div id="stage" class="flex flex-col items-center" style="width:300px; margin-bottom:16vh;">

    <!-- 品牌识别组 -->
    <div class="flex flex-col items-center">
      <div class="flex items-center justify-center"
           style="width:52px; height:52px; border-radius:14px; background:var(--bg-surface); border:1px solid var(--border-card); box-shadow:0 1px 2px rgba(15,23,19,0.04);">
        <!-- 品牌矢量图形 26x26 · 线条 2.2 -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#216747" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v12"/>
          <path d="M4 19h16"/>
          <path d="M9 8.5h2.6a3.4 3.4 0 0 1 0 6.8H9V8.5"/>
        </svg>
      </div>
      <div class="font-semibold" style="margin-top:8px; font-size:16px; color:var(--text-main); letter-spacing:0.01em;">Desko</div>
    </div>

    <!-- 核心解锁输入区 -->
    <div class="unlock-field w-full flex items-center" style="height:40px; border-radius:10px; margin-top:24px; padding:0 6px 0 10px; gap:8px;">
      <!-- 常驻浅灰锁图标 16px -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a6b5ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
        <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
      </svg>
      <input id="password" type="password" autocomplete="off" autofocus placeholder="输入主密码解锁"
             class="w-full min-w-0" style="font-size:13px; font-weight:400; color:var(--text-main); height:100%;" />
      <!-- 26x26 内嵌提交按钮 -->
      <button id="submit" class="submit-btn flex items-center justify-center flex-none cursor-pointer"
              style="width:26px; height:26px; border-radius:6px;" aria-label="解锁">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h13"/>
          <path d="M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>

    <!-- 防跳动报错占位槽：恒定 20px -->
    <div class="flex items-center justify-center w-full" style="height:20px;">
      <span id="error" class="transition-opacity duration-200 opacity-0"
            style="font-size:12px; color:#c9372c;">主密码错误，请重试</span>
    </div>

    <!-- 底部座右铭 -->
    <div class="text-center" style="font-size:12px; color:var(--text-dim); letter-spacing:0.2em; margin-top:8px;">
      · 星光不问赶路人，时光不负有心人 ·
    </div>

  </div>
</div>

<script>
  const password = document.getElementById('password');
  const submit   = document.getElementById('submit');
  const error    = document.getElementById('error');
  const stage    = document.getElementById('stage');

  function showError() {
    error.classList.remove('opacity-0');
    stage.classList.remove('shake');
    void stage.offsetWidth;          // 重启动画
    stage.classList.add('shake');
    password.select();
  }

  function tryUnlock() {
    if (!password.value) { password.focus(); return; }
    showError();                     // 原型：无后端，提交一律走报错演示
  }

  submit.addEventListener('click', tryUnlock);
  password.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
  password.addEventListener('input', () => error.classList.add('opacity-0'));

  document.addEventListener('DOMContentLoaded', () => password.focus());
</script>
</body>
</html>
