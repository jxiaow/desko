     改完重跑：
       node scripts/mock-build.mjs docs/design/atmosphere/01-field-tuning.src.html docs/design/atmosphere/01-field-tuning.html
       node scripts/mock-frames.mjs docs/design/atmosphere/01-field-tuning.html docs/design/atmosphere/shots atmo \
         dark-ink dark-str tint-paper tint-mix anchor-snow anchor-cand dlg-slate dlg-thru dark-chroma \
         bare-ink-base bare-ink-chroma bare-slate-base bare-slate-chroma bare-anchor bare-anchor-cand
     十五帧：A–I 带完整外壳（同页同布局，只差光场配方），J–O 裸光场（只剩背景配方 + 两块卡面探针 + 阅读列虚线）。
       A/B 墨·翡翠 提强度（21/14→23/19）——算下来只有 ΔRGB 1–5，是噪声级，留作反例
       C/D 纸·湖蓝 提掺入（65/60→75/70）——同上，且方向是让氛围更弱
       E/F 雪·陶橙 锚点跟正文列（14%12% + 95%95% → 26%14% + 84%90%）
       G/H 岩·群青 弹窗光场与窗外连续（floating 自带光场 → 透出窗外同一片）
       I + J/K + L/M 换轴：深底把亮度预算让给彩度（光场色压到"卡面 L*−1.5"，alpha 21/14→45/34）
     数值账本见同目录 field-math.mjs（解析解，非截图取色）。
     尺寸说明：真 app 用 clamp(…, 78vw, …) 按窗口算，mock 视口≠窗口，故在 .win 上钉成
     1040×670 窗口的等值 px（811/570 与 853/603），保持现状帧与建议帧同一条基准。 -->
<html lang="zh"><head><meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "HarmonyOS Sans SC", system-ui, sans-serif; }
:root, .theme-scope {
  /* 强调色混入底色后再铺柔光，避免高饱和色把工作区染成整片彩色。 */
  --material-tint-primary: #4979df;
  --material-tint-secondary: #71b7c8;
  --material-color-primary: color-mix(in srgb, var(--material-tint-primary) 65%, var(--sunken));
  --material-color-secondary: color-mix(in srgb, var(--material-tint-secondary) 60%, var(--sunken));
  --material-primary-strength: 23%;
  --material-secondary-strength: 16%;
  --material-lock-primary-strength: 28%;
  --material-lock-secondary-strength: 19%;
  --material-navigation-strength: 8%;
  /* 用覆盖范围保留氛围感，控制浓度，让全窗渐变轻柔地融入主题底色。 */
  --material-field-primary-size: clamp(680px, 78vw, 1500px) clamp(480px, 85vh, 1020px);
  --material-field-secondary-size: clamp(680px, 82vw, 1580px) clamp(480px, 90vh, 1080px);
  --material-dither: url('/atmosphere-dither.svg');
  --material-field:
    var(--material-dither),
    radial-gradient(ellipse 65% 75% at 50% 52%, color-mix(in srgb, var(--panel-bg) 28%, transparent), transparent 90%),
    radial-gradient(ellipse var(--material-field-primary-size) at 14% 12%, color-mix(in srgb, var(--material-color-primary) var(--material-primary-strength), transparent), transparent 100%),
    radial-gradient(ellipse var(--material-field-secondary-size) at 95% 95%, color-mix(in srgb, var(--material-color-secondary) var(--material-secondary-strength), transparent), transparent 100%);
  --material-lock-field:
    var(--material-dither),
    radial-gradient(ellipse 60% 70% at 50% 48%, color-mix(in srgb, var(--panel-bg) 22%, transparent), transparent 90%),
    radial-gradient(ellipse min(80vw, 1280px) min(94vh, 1000px) at 18% 16%, color-mix(in srgb, var(--material-color-primary) var(--material-lock-primary-strength), transparent), transparent 100%),
    radial-gradient(ellipse min(80vw, 1280px) min(90vh, 960px) at 92% 86%, color-mix(in srgb, var(--material-color-secondary) var(--material-lock-secondary-strength), transparent), transparent 100%);
  --material-floating-field:
    linear-gradient(color-mix(in srgb, var(--panel-bg) 70%, transparent), color-mix(in srgb, var(--panel-bg) 70%, transparent)),
    var(--material-field), var(--panel-bg);
  --material-editor-field:
    linear-gradient(color-mix(in srgb, var(--bg) 65%, transparent), color-mix(in srgb, var(--bg) 65%, transparent)),
    var(--material-field), var(--bg);
  --border-navigation: color-mix(in srgb, var(--text) 3%, transparent);

  --bg-app: var(--material-field), var(--sunken);
  --bg-toolbar: var(--bg-app);
  --bg-sidebar: var(--sidebar-bg);
  --bg-nav-overlay: var(--sidebar-bg);
  --bg-dialog: var(--panel-bg);
  --bg-popover: color-mix(in srgb, var(--panel-bg) 96%, transparent);
  --bg-menu: var(--panel-bg);
  --bg-dock: var(--panel-bg);
  --bg-editor: var(--bg);
  --bg-input: var(--bg);
  --bg-input-focus: var(--panel-bg);
  --bg-canvas-input: color-mix(in srgb, var(--text) 7%, transparent);
  --bg-surface: var(--panel-bg);
  --bg-surface-hover: var(--hover);
  --bg-surface-active: var(--active);
  --bg-tag-default: var(--badge-cat-bg);
  --bg-mono-chip: var(--sunken);
  --bg-statusbar: var(--panel-bg);
  --hover-chrome: color-mix(in srgb, var(--text) 9%, transparent);

  --floating-background-attachment: scroll;
  --nav-overlay-background-attachment: scroll;
  --editor-background-attachment: scroll;
  --text-canvas-meta: var(--text-secondary);
  --text-nav-label: var(--text-secondary);
  --text-nav-section: var(--text-secondary);

  --bg-lock: linear-gradient(135deg, var(--lock-wash-a) 0%, var(--lock-wash-b) 100%);
  --material-decoration-display: block;

}

:root[data-atmosphere="on"], .theme-scope[data-atmosphere="on"] {
  /* 薄底色保留主题冷暖，主侧栏直接透出全窗光场，让分界两侧的颜色连续。 */
  --bg-sidebar: color-mix(in srgb, var(--sidebar-bg) var(--material-navigation-strength), transparent);
  /* 抽屉覆盖在正文上，需自带不透明底色，避免透出正文。 */
  --bg-nav-overlay: var(--material-floating-field);
  --bg-dialog: var(--material-floating-field);
  --bg-popover: var(--material-floating-field);
  --bg-menu: var(--material-floating-field);
  --bg-dock: var(--material-floating-field);
  --bg-editor: var(--material-editor-field);
  --bg-canvas-input: var(--bg-input);

}
:root[data-atmosphere="off"], .theme-scope[data-atmosphere="off"] {
  --bg-app: var(--sunken);
  --bg-lock: var(--bg);
  --material-decoration-display: none;

}
:root {
  /* 间距系统 - 4px 基础 */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  /* 圆角系统 */
  --radius-xs: 4px;
  --radius-sm: 6px;
  /* 控件档：图标按钮与小型按钮专用。原先它们跟着 --radius-sm 吃 6px，28px 的钮只占短边 21%，
     是全场最方的一档（卡片 10/56≈18% 但有 14px 弹窗与胶囊压着）。抬到 9px≈32%，落回同一轨。
     只给按钮——输入字段/标签/气泡仍走 --radius-sm，圆角轴一分为二，别互相牵连。 */
  --radius-ib: 9px;
  --radius: 10px;
  --radius-md: 12px;
  --radius-lg: 10px;
  --radius-xl: 14px;
  --radius-pill: 99px;

  /* 字号阶梯：所有 UI 文本走这条轴，不再用 10.5/11.5/12.5/13.5/14.5/17.5 这种半像素。
     编辑器/列表/标题等组件用一档；需要略大或略小时优先调字重，不挤字号档。
     body 的 15px 走 --text-md。大方化轮整体上抬一档（docs/design/spacious/01-plan.md）。
     2xs/3xl 是本轮补的两端：
       · 2xs 只给"嵌在固定小盒子里的辅助信息"（键帽、单位、分组小标、卡脚标签），
         正文与说明文字不许降到这一档以下（lighten 轮已把 11px 的说明文字抬到 12）；
       · 3xl 只给"读一个大数值"的读数面（验证码），其余文本停在 2xl。 */
  --text-2xs: 11px;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 30px;

  /* AppIcon :size 走这几档，不再 10/11/12/13/14/15/16/18/24 全谱散布。
     组件传 :size 时按数值用，CSS 写 width/height 时引用 px 形式。
     tile 档 18：34px 身份档里的图形，16 显小、20 顶边，与档内 favicon 的 22px 图取同一重量 */
  --icon-xs-px: 12px;
  --icon-sm-px: 14px;
  --icon-md-px: 16px;
  --icon-tile-px: 18px;
  --icon-lg-px: 20px;
  --icon-xl-px: 26px;

  /* 批量浮底栏占位高度：所有列表容器底部要让出这块空间，避免最后一行被遮 */
  --dock-clearance: 96px;

  /* 过渡 */
  --transition-fast: 0.1s cubic-bezier(0.4, 0, 0.2, 1);
  --transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-spring: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);

  /* 布局尺度 */
  /* 侧栏三态（V5.2 收编轮 P2）：展开 208 / 图标轨 56 / 收起 0，
     第三态不占宽，恢复入口在标题栏面包屑左侧 */
  --sidebar-w: 208px;
  --sidebar-rail-w: 56px;
  /* 内容区的最小水平留白；工具栏与卡片共用同一阅读列 */
  --page-gutter: 24px;
  /* 经典滚动条占位宽度，::-webkit-scrollbar 与侧栏的槽补偿都取它 */
  --scrollbar-track: 9px;
  /* 全屏书写栏宽度：大窗口适度放宽，保留居中留白与阅读行长 */
  --fs-max: 1200px;
  /* 小记流宽度：正常窗口铺满，最大化时收到这个上限 */
  --stream-max: 1200px;
  /* 列表页的阅读列上限：按视口给，侧栏展开/折叠不跟着抖。
     1235 常态窗与 1440 都还吃在 900 下限上，只有最大化（≥1920）才涨到 1120。
     上限之外的余量由左右两侧均分，阅读列在可用内容区内居中 */
  --content-max: clamp(900px, calc(100vw - 800px), 1120px);
  /* 小记卡片正文高度上限：短的小记按实际内容，长的由 JS 收在这里之上最近的整行边界 */
  --memo-max-h: 144px;
  --rail-w: 248px;
  /* 小记顶栏的实际占位高度：粘性日期行和窄窗口下的浮层侧栏都要从它下面开始。
     一行头方言（Things）后 .page-bar = padding-top 16 + 控件 32 + padding-bottom 16（border-box）= 64px 定高 */
  --stream-bar-h: 64px;
  /* 容器窄于此值时收起右栏，筛选降级为浮层 */
  --rail-min-room: 900px;

}
:where(:root), [data-theme="paper"] {
  /* 品牌缺省：墨蓝（accent 覆盖层会按 data-accent 重填这一族） */
  --accent: #2856c7;
  --accent-hover: #234bad;
  --accent-active: #1e4093;
  --accent-on: #ffffff;
  --accent-soft: #dde4f6;
  --accent-light: #c3d0ef;
  --accent-ring: rgba(40, 86, 199, 0.2);
  --text-brand: #234bad;

  /* 面：暖白五档。卡面不上纯白，悬停比卡面暗一档，避免柔光盖掉反馈。 */
  --bg: #f8f5f0;
  --panel-bg: #fcfaf7;
  --chrome-bg: rgba(248, 245, 240, 0.78);
  --sunken: #f1ede7;
  --fill: #e8e2d9;
  --hover: #f6f3ee;
  --active: #eae4db;
  --overlay: rgba(29, 28, 26, 0.42);

  /* 文字：四级近中性，深字浅底一眼可读 */
  --text: #333230;
  --text-secondary: #4d4c49;
  --text-muted: #6b6a66;
  --text-faint: #95948e;

  /* 描边：层级靠边框，不靠色块 */
  --border: #e2dbd1;
  --border-strong: #cec5b8;
  --border-subtle: #f1ede7;
  --border-hover: #cec5b8;

  /* URL 与胶囊徽标：浅色下各自贴边框族和强调族 */
  --text-url: #4d4c49;
  --badge-cat-bg: #eee8df;
  --badge-cat-border: #e2dbd1;
  --badge-cat-text: #4d4c49;
  --badge-ver-bg: #dde4f6;
  --badge-ver-text: #234bad;

  /* 投影带暖褐，纯灰投影在米底上会显脏 */
  --shadow-xs: 0 1px 2px 0 rgba(29, 28, 26, 0.04);
  /* 轻量化轮：行卡不再靠宽大软影浮起，阴影只留一丝贴地感，分层交还发丝描边 */
  --shadow-card: 0 1px 2px 0 rgba(29, 28, 26, 0.04);
  --shadow-sm: 0 1px 3px 0 rgba(29, 28, 26, 0.05);
  --shadow: 0 4px 12px -2px rgba(29, 28, 26, 0.06), 0 0 0 1px #cec5b8;
  --shadow-md: 0 6px 16px -6px rgba(29, 28, 26, 0.10);
  --shadow-lg: 0 12px 28px -8px rgba(29, 28, 26, 0.14);
  --shadow-pop: 0 16px 36px -8px rgba(29, 28, 26, 0.12), 0 4px 10px -2px rgba(29, 28, 26, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.06);
  /* 批量药丸浮在列表之上，要比任何弹层都高：弥散更深、落点更远，只用当前主题的字色 */
  --shadow-dock: 0 26px 60px -18px rgba(29, 28, 26, 0.32), 0 6px 18px rgba(29, 28, 26, 0.14);

  /* 状态色：一个语义一档强度，浅色下全部 ≥4.5:1 可读写。
     危险取砖红（与暖纸同色温），成功取青瓷苔绿，警告取土黄。 */
  --danger: #a9443c;
  --danger-on: #ffffff;
  --danger-hover: #8c362f;
  --danger-soft: #f7ece9;
  --danger-border: #eacfc8;
  --success: #3d7355;
  --success-soft: #ecf3ee;
  --warning: #96682a;
  --warning-soft: #f6efdf;

  /* 侧栏 —— 只有底色两档是每套主题各调的，其余见下方别名块 */
  --sidebar-bg: #eae4db;
  --sidebar-hover: #e2dbd1;

  /* 品牌标渐变 */
  --brand-g1: #6485d7;
  --brand-g2: #2856c7;
  --brand-g3: #1e4093;
  --brand-knob: #ffffff;

  /* 锁屏 */
  --lock-wash-a: #fcfaf7;
  --lock-wash-b: #eae4db;
  --lock-orb-1: rgba(40, 86, 199, 0.07);
  --lock-orb-2: rgba(40, 86, 199, 0.045);

  /* 毛玻璃底栏 */
  --frost-bg: rgba(252, 250, 247, 0.86);
  --frost-border: #e2dbd1;

  /* 深色面：气泡与 toast */
  --tip-bg: #26241f;
  --tip-fg: #f2f0ea;
  --toast-bg: #26241f;
  --toast-ok: #9cc4ae;
  --toast-err: #e09a92;
  --toast-info: #91baff;

  /* 滚动条与选区 */
  --scrollbar: rgba(29, 28, 26, 0.16);
  --scrollbar-hover: rgba(29, 28, 26, 0.28);
  --selection: rgba(40, 86, 199, 0.22);

  /* 头像：按分类取色，六档同明度同彩度（v2 起只服务内容侧） */
  --cat-1: #5f62b8;
  --cat-2: #7b5fb0;
  --cat-3: #a85b7d;
  --cat-4: #937042;
  --cat-5: #46806b;
  --cat-6: #457f8a;
  --cat-text: #ffffff;

  /* 文件类型：保留 pdf红/doc蓝/xls绿 的通用认知，只降饱和 */
  --ft-pdf: #b8564f;
  --ft-doc: #4a6d9c;
  --ft-sheet: #3f7a5e;
  --ft-deck: #a0603a;
  --ft-arch: #6a5a99;
  --ft-code: #8a7534;
  --ft-mark: #5e6672;
  --ft-img: #9a5a72;
  --ft-unk: #7a7f88;

  /* 代码块：与界面同一只手的色温（配色收口轮：整族在 --sunken 上顶住 4.5，
     注释/标点保持"最静"档但不再是看不见） */
  --code-fg: #1a1b20;
  --code-kw: #9d5275;
  --code-str: #3a7256;
  --code-num: #96593a;
  --code-type: #7d6a2f;
  --code-fn: #4a6d9c;
  --code-var: #5e6672;
  --code-com: #686a73;
  --code-tag: #6a5a99;
  --code-pun: #5e6168;

  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'HarmonyOS Sans SC', 'Microsoft YaHei UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  /* Consolas 没有中文字形：不在它后面接 UI 中文族，等宽件里的中文（占位符、子路径、代码注释）
     就会回落到宋体，和同一行的无衬线文字明显两种笔形 */
  --font-mono: Consolas, 'JetBrains Mono', 'HarmonyOS Sans SC', 'Microsoft YaHei UI', monospace;

}

}
/* 宽窗档：clamp 按 1440×900 取等值 px，虚线为 720px 阅读列与侧栏右界 */

.probe.br { right: 24px; bottom: 24px; }
.pl { font-size: 11.5px; color: var(--text-muted); }

/* ---- 四组建议配方：只动配方叶子变量，其余令牌全部沿用真值 ---- */
.win[data-v="dark"] { --material-primary-strength: 23%; --material-secondary-strength: 19%; }
.win[data-v="tint"] {
  --material-color-primary: color-mix(in srgb, var(--material-tint-primary) 75%, var(--sunken));
  --material-color-secondary: color-mix(in srgb, var(--material-tint-secondary) 70%, var(--sunken));
}
/* 换轴档：深底把预算从亮度挪到彩度。光场色 = accent 压到"卡面 L* − 1.5"，
   于是 alpha 敢给到 45/34，而画布峰值 L* 仍低于卡面（墨底卡面 L* 12.7）。

  --material-secondary-strength: 34%;

}
