<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>氛围视觉复核与方案对比</title><style>body{margin:28px;background:#e8e7e4;color:#252627;font:14px system-ui,sans-serif}main{max-width:1920px;margin:auto}h1{font-size:25px;margin:0 0 12px}p{color:#636466;line-height:1.7}header{max-width:1000px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:16px 0;position:sticky;top:0;z-index:1;background:#e8e7e4}select,button{font:inherit;background:#f7f7f5;border:1px solid #c6c7c5;padding:9px 14px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{background:#272a2b;color:#fff}#stage{overflow:auto;border:1px solid #c6c7c5;background:#dadbd9}img{display:block;width:100%;height:auto}#stage.native img{width:auto;max-width:none}#caption{font-size:13px;margin:10px 0;color:#636466}a{color:inherit}</style><main><header><h1>氛围视觉复核 · 已落地</h1><p>对比调整前配方与当前源码的真实页面。调整后未叠加候选 CSS；所有截图使用演示数据。点击切换按钮查看差异，原尺寸模式保留截图像素尺寸。</p></header><div class="toolbar"><select id="scene"></select><button data-v="before" aria-pressed="true">调整前</button><button data-v="after" aria-pressed="false">调整后（实际源码）</button><button id="size" aria-pressed="false">原尺寸</button></div><div id="stage"><img id="shot" alt="氛围方案截图"></div><p id="caption"></p></main><script>const cases=[{"id":"native-shape","title":"雪 × 湖蓝 · Codex · 常态窗口","theme":"snow","accent":"teal","scene":"codex","width":1040,"height":670,"images":{"before":"native-shape-before.png","after":"native-shape-after.png"}},{"id":"codex-light","title":"雪 × 湖蓝 · Codex","theme":"snow","accent":"teal","scene":"codex","width":1440,"height":900,"images":{"before":"codex-light-before.png","after":"codex-light-after.png"}},{"id":"codex-wide","title":"雪 × 湖蓝 · Codex · 宽窗","theme":"snow","accent":"teal","scene":"codex","width":1920,"height":1080,"images":{"before":"codex-wide-before.png","after":"codex-wide-after.png"}},{"id":"entries-warm","title":"纸 × 群青 · 密集列表","theme":"paper","accent":"ink","scene":"entries","width":1440,"height":900,"images":{"before":"entries-warm-before.png","after":"entries-warm-after.png"}},{"id":"codex-dark","title":"墨 × 翡翠 · Codex","theme":"ink","accent":"celadon","scene":"codex","width":1440,"height":900,"images":{"before":"codex-dark-before.png","after":"codex-dark-after.png"}},{"id":"codex-slate","title":"岩 × 群青 · Codex · 宽窗","theme":"slate","accent":"ink","scene":"codex","width":1920,"height":1080,"images":{"before":"codex-slate-before.png","after":"codex-slate-after.png"}},{"id":"notes-light","title":"绢 × 湖蓝 · 小记","theme":"linen","accent":"teal","scene":"notes","width":1440,"height":900,"images":{"before":"notes-light-before.png","after":"notes-light-after.png"}},{"id":"notes-dark","title":"墨 × 翡翠 · 小记","theme":"ink","accent":"celadon","scene":"notes","width":1440,"height":900,"images":{"before":"notes-dark-before.png","after":"notes-dark-after.png"}},{"id":"settings-light","title":"雪 × 湖蓝 · 设置","theme":"snow","accent":"teal","scene":"settings","width":1440,"height":900,"images":{"before":"settings-light-before.png","after":"settings-light-after.png"}},{"id":"settings-dark","title":"墨 × 翡翠 · 设置","theme":"ink","accent":"celadon","scene":"settings","width":1440,"height":900,"images":{"before":"settings-dark-before.png","after":"settings-dark-after.png"}},{"id":"editor-dark","title":"岩 × 群青 · 阅读","theme":"slate","accent":"ink","scene":"editor","width":1440,"height":900,"images":{"before":"editor-dark-before.png","after":"editor-dark-after.png"}},{"id":"lock-light","title":"雪 × 湖蓝 · 锁屏","theme":"snow","accent":"teal","scene":"lock","width":1440,"height":900,"images":{"before":"lock-light-before.png","after":"lock-light-after.png"}},{"id":"lock-dark","title":"墨 × 翡翠 · 锁屏","theme":"ink","accent":"celadon","scene":"lock","width":1440,"height":900,"images":{"before":"lock-dark-before.png","after":"lock-dark-after.png"}}];let variant='before';const scene=document.getElementById('scene'),stage=document.getElementById('stage');for(const c of cases){const o=document.createElement('option');o.value=c.id;o.textContent=c.title+' · '+c.width+' × '+c.height;scene.append(o)}function show(){const c=cases.find(c=>c.id===scene.value);document.getElementById('shot').src='shots/06-spatial-applied/'+c.images[variant];document.getElementById('caption').textContent=c.title+' / '+document.querySelector('[data-v="'+variant+'"]').textContent+' / '+c.width+' × '+c.height}for(const b of document.querySelectorAll('[data-v]'))b.onclick=()=>{variant=b.dataset.v;for(const x of document.querySelectorAll('[data-v]'))x.setAttribute('aria-pressed',String(x===b));show()};scene.onchange=show;document.getElementById('size').onclick=e=>{stage.classList.toggle('native');e.target.setAttribute('aria-pressed',String(stage.classList.contains('native')))};show()</script></html>
