<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Desko · 网址收藏</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-app: #f4f7f5;
    --bg-sidebar: #ebf0ed;
    --bg-surface: #ffffff;
    --border-base: #dce3df;
    --border-card: #e1e8e3;
    --border-card-hover: #c6d6cd;
    --text-main: #0f1713;
    --text-muted: #4a5c52;
    --text-dim: #7d9185;
    --brand: #216747;
    --brand-hover: #195237;
    --brand-light: #e0ece5;
  }
  * {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    background: var(--bg-app);
    color: var(--text-main);
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

  /* 统一几何盒模型，杜绝基线错位 */
  .baseline-fix {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    box-sizing: border-box;
    line-height: 1;
  }

  /* ---- 全高侧栏 180 ↔ 56 ---- */
  #sidebar {
    width: 180px;
    flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-base);
    transition: width .2s cubic-bezier(.4,0,.2,1);
    overflow: hidden;
  }
  #sidebar.collapsed { width: 56px; }
  .side-label {
    opacity: 1;
    max-width: 200px;
    overflow: hidden;
    white-space: nowrap;
    transition: opacity .15s ease, max-width .2s cubic-bezier(.4,0,.2,1);
  }
  #sidebar.collapsed .side-label { opacity: 0; max-width: 0; }
  .side-row {
    transition: padding .2s cubic-bezier(.4,0,.2,1), gap .2s cubic-bezier(.4,0,.2,1), justify-content .2s;
  }
  #sidebar.collapsed .side-row {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }

  .select-all { user-select: all; -webkit-user-select: all; }
  .entry-card { height: 58px; border: 1px solid var(--border-card); background: var(--bg-surface); transition: border-color .12s ease; }
  .entry-card:hover { border-color: var(--border-card-hover); }
</style>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          app: 'var(--bg-app)', sidebar: 'var(--bg-sidebar)', surface: 'var(--bg-surface)',
          line: 'var(--border-base)', card: 'var(--border-card)', cardhover: 'var(--border-card-hover)',
          main: 'var(--text-main)', muted: 'var(--text-muted)', dim: 'var(--text-dim)',
          brand: 'var(--brand)', brandhover: 'var(--brand-hover)', brandlight: 'var(--brand-light)'
        }
      }
    }
  }
</script>
</head>
<body class="h-screen w-screen overflow-hidden flex">

  <!-- ===== 全高贯通式侧边栏 ===== -->
  <aside id="sidebar" class="h-full flex flex-col">
    <!-- 侧栏顶部首行 40px -->
    <div class="side-row shrink-0 h-[40px] flex items-center justify-between px-2 border-b border-line">
      <div class="side-row flex items-center gap-1.5 min-w-0">
        <span class="side-label baseline-fix shrink-0 w-[20px] h-[20px] rounded-[5px] bg-brand text-white text-[11px] font-semibold">D</span>
        <span class="side-label text-[13.5px] font-semibold text-main">Desko</span>
      </div>
      <button id="sidebarToggle" onclick="toggleSidebar()" class="baseline-fix shrink-0 w-[26px] h-[26px] rounded-md text-dim hover:bg-brandlight hover:text-brand" title="收起侧栏 (Ctrl+B)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
    </div>

    <!-- 导航 -->
    <nav class="flex-1 min-h-0 overflow-y-auto py-2 px-2 flex flex-col gap-1">
      <a href="#" class="side-row h-8 flex items-center gap-2 px-2 rounded-md bg-brandlight text-brand text-[12.5px] font-medium">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="side-label flex-1 min-w-0">网址收藏</span>
        <span class="side-label baseline-fix shrink-0 mono text-[11.5px] px-1.5 h-[18px] rounded-full bg-surface border border-line text-dim">7</span>
      </a>
      <a href="#" class="side-row h-8 flex items-center gap-2 px-2 rounded-md text-muted hover:bg-brandlight hover:text-main">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span class="side-label flex-1 min-w-0">小记</span>
        <span class="side-label baseline-fix shrink-0 mono text-[11.5px] px-1.5 h-[18px] rounded-full bg-surface border border-line text-dim">5</span>
      </a>
      <a href="#" class="side-row h-8 flex items-center gap-2 px-2 rounded-md text-muted hover:bg-brandlight hover:text-main">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span class="side-label flex-1 min-w-0">文件快捷</span>
      </a>
      <a href="#" class="side-row h-8 flex items-center gap-2 px-2 rounded-md text-muted hover:bg-brandlight hover:text-main">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></svg>
        <span class="side-label flex-1 min-w-0">局域网传输</span>
      </a>
    </nav>
  </aside>

  <!-- ===== 右侧主工作区 ===== -->
  <div class="flex-1 min-w-0 h-full flex flex-col">

    <!-- 顶部系统窗体控制栏 40px -->
    <header class="shrink-0 h-[40px] flex items-center justify-end bg-app" data-tauri-drag-region>
      <div class="flex items-center h-full">
        <button class="baseline-fix w-[44px] h-full text-dim hover:bg-sidebar hover:text-main" title="最小化">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="baseline-fix w-[44px] h-full text-dim hover:bg-sidebar hover:text-main" title="最大化">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="baseline-fix w-[44px] h-full text-dim hover:bg-sidebar hover:text-main" title="关闭">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1"/></svg>
        </button>
      </div>
    </header>

    <!-- 模块工具栏 44px -->
    <div class="shrink-0 h-[44px] flex items-center gap-2.5 px-3 bg-surface border-b border-line">
      <h1 class="shrink-0 text-[14px] font-semibold text-main mr-1">网址收藏</h1>

      <label class="baseline-fix w-[220px] h-8 gap-2 px-2.5 rounded-md bg-app border border-line focus-within:border-brand">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" class="shrink-0 text-dim"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="text" placeholder="搜索标题、网址…" class="flex-1 min-w-0 w-full bg-transparent outline-none border-0 text-[12.5px] text-main placeholder:text-dim" />
        <kbd class="baseline-fix shrink-0 mono text-[9.5px] text-dim bg-sidebar border border-line rounded px-1 h-[16px]">Ctrl K</kbd>
      </label>

      <div class="shrink-0 flex items-center gap-1.5">
        <button class="baseline-fix h-8 gap-1.5 px-2.5 rounded-md bg-brandlight text-brand text-[12.5px] font-medium">全部 <span class="mono text-[11.5px] text-muted">7</span></button>
        <button class="baseline-fix h-8 gap-1.5 px-2.5 rounded-md text-muted hover:bg-sidebar text-[12.5px]">XYLink App <span class="mono text-[11.5px] text-dim">4</span></button>
        <button class="baseline-fix h-8 gap-1.5 px-2.5 rounded-md text-muted hover:bg-sidebar text-[12.5px]">Jenkins <span class="mono text-[11.5px] text-dim">3</span></button>
      </div>

      <div class="shrink-0 ml-auto flex items-center gap-2">
        <button class="baseline-fix w-8 h-8 rounded-md border border-line text-muted hover:bg-sidebar hover:text-main" title="批量编辑">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="2" y="2.5" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 6h6M5 9h6M5 12h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        </button>
        <button class="baseline-fix h-8 gap-1.5 px-3.5 rounded-md bg-brand hover:bg-brandhover text-white text-[12.5px] font-medium">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          新增条目
        </button>
      </div>
    </div>

    <!-- 卡片列表流 -->
    <section id="list" class="flex-1 min-h-0 overflow-y-auto px-3 py-2.5 flex flex-col gap-1.5"></section>

    <!-- 底部极简状态栏 28px -->
    <footer class="shrink-0 h-[28px] flex items-center justify-between px-3 border-t border-line bg-surface text-[11.5px] text-dim">
      <span>共 7 条 · 当前筛选「全部」</span>
      <span class="mono">1040 × 670</span>
    </footer>
  </div>

<script>
const ENTRIES = [
  { badge:'XY', title:'XYLink 管理台',   note:'内部门户 · 日常构建入口',   url:'http://xylink.internal:8080/dashboard', chip:'prod',     cat:'XYLink App' },
  { badge:'JE', title:'Jenkins 构建',    note:'CI 任务队列与产物下载',     url:'http://jenkins.internal/job/xyapp',     chip:'20260928', cat:'Jenkins' },
  { badge:'LX', title:'Linux 内核源码',  note:'内核社区邮件列表归档',       url:'https://lore.kernel.org/lkml',          chip:'master',   cat:'XYLink App' },
  { badge:'LA', title:'Lang 文档站',     note:'标准库 API 参考',           url:'https://docs.lang.dev/stdlib',          chip:'v3.2',     cat:'Jenkins' },
  { badge:'WD', title:'Web 调试代理',    note:'本地请求抓包面板',           url:'http://127.0.0.1:9090/requests',        chip:'local',    cat:'XYLink App' },
  { badge:'GI', title:'Gitee 镜像仓',    note:'内网依赖镜像同步',           url:'https://gitee.com/mirrors/openssl',     chip:'mirror',   cat:'Jenkins' },
  { badge:'RO', title:'路由器后台',      note:'局域网设备管理',             url:'http://192.168.31.1/admin',             chip:'lan',      cat:'XYLink App' },
];

const ICON = {
  copy: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 3.5A1.5 1.5 0 009 2H4a1.5 1.5 0 00-1.5 1.5v5A1.5 1.5 0 004 10" stroke="currentColor" stroke-width="1.3"/></svg>',
  open: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M9 3h4v4M13 3L7 9M11 9.5V12a1.5 1.5 0 01-1.5 1.5h-7A1.5 1.5 0 011 12V5a1.5 1.5 0 011.5-1.5H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  more: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="3.5" cy="8" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/><circle cx="12.5" cy="8" r="1.1" fill="currentColor"/></svg>',
};

function render() {
  document.getElementById('list').innerHTML = ENTRIES.map(e => `
  <article class="entry-card group shrink-0 rounded-lg flex items-center gap-3 px-3">
    <div class="w-[210px] shrink-0 flex items-center gap-2.5 min-w-0">
      <span class="baseline-fix shrink-0 w-8 h-8 rounded-lg bg-sidebar text-brand text-[11.5px] font-semibold mono">${e.badge}</span>
      <span class="min-w-0 flex flex-col justify-center">
        <span class="text-[13.5px] font-semibold text-main truncate leading-[18px]">${e.title}</span>
        <span class="text-[11.5px] text-dim truncate leading-[15px]">${e.note}</span>
      </span>
    </div>
    <div class="flex-1 min-w-0 flex items-center gap-2">
      <span class="select-all mono text-[12.5px] text-muted truncate">${e.url}</span>
      <span class="baseline-fix shrink-0 w-auto h-5 px-1.5 rounded mono text-[11.5px] text-dim bg-sidebar">${e.chip}</span>
    </div>
    <div class="w-[100px] shrink-0 flex justify-center">
      <span class="baseline-fix max-w-full h-[22px] px-2 rounded-full text-[11.5px] text-brand bg-brandlight"><span class="truncate">${e.cat}</span></span>
    </div>
    <div class="w-[84px] shrink-0 flex items-center justify-end gap-0.5 opacity-70 group-hover:opacity-100 transition-opacity duration-100">
      <button class="baseline-fix w-7 h-7 rounded text-dim hover:bg-sidebar hover:text-main" title="复制网址">${ICON.copy}</button>
      <button class="baseline-fix w-7 h-7 rounded text-dim hover:bg-sidebar hover:text-main" title="外部打开">${ICON.open}</button>
      <button class="baseline-fix w-7 h-7 rounded text-dim hover:bg-sidebar hover:text-main" title="更多操作">${ICON.more}</button>
    </div>
  </article>`).join('');
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const collapsed = sb.classList.toggle('collapsed');
  const btn = document.getElementById('sidebarToggle');
  btn.title = (collapsed ? '展开侧栏' : '收起侧栏') + ' (Ctrl+B)';
}

document.addEventListener('keydown', (ev) => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'b') { ev.preventDefault(); toggleSidebar(); }
});

render();
if (location.hash === '#collapsed') toggleSidebar();
</script>
</body>
</html>
