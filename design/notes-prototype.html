<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desko · 小记原型 v2 — 单栏流 · 就地展开</title>
<style>
/* ============================================================
   令牌 —— 逐字转录自 src/styles/global.css:1-68
   ============================================================ */
/* 这里的色值与 src/styles/global.css 的 cool 主题块保持一致（应用的新默认档）。
   原型是独立文件，不 import 全局样式，所以改主题时记得回来同步一次。 */
:root {
  --accent: #5b57d9; --accent-hover: #4c48c6; --accent-active: #3e3aa4;
  --accent-soft: #eeedfb; --accent-light: #dcd9f6; --accent-ring: rgba(91, 87, 217, 0.15);
  --bg: #f8f8fa; --panel-bg: #ffffff; --chrome-bg: #f1f1f5;
  --sunken: #e9ebf1; --fill: #e4e6ee; --active: #ececfb;
  --border: #e3e3ea; --border-strong: #c9c9d3; --border-subtle: #eeeff3; --hover: #eef0f4;
  --text: #1a1b20; --text-secondary: #5c5e68; --text-muted: #8b8d98; --text-faint: #b4b6c0;
  --shadow-xs: 0 1px 2px 0 rgba(26, 27, 32, 0.07);
  --shadow-sm: 0 1px 2px 0 rgba(26, 27, 32, 0.05);
  --shadow: 0 2px 6px -1px rgba(26, 27, 32, 0.08);
  --shadow-md: 0 6px 16px -6px rgba(26, 27, 32, 0.14), 0 1px 3px rgba(26, 27, 32, 0.06);
  --shadow-lg: 0 12px 28px -8px rgba(26, 27, 32, 0.18);
  --shadow-pop: 0 20px 44px -12px rgba(26, 27, 32, 0.24), 0 2px 8px rgba(26, 27, 32, 0.08);
  --danger: #c9453f; --danger-hover: #ab3833; --danger-soft: #fbeceb; --danger-border: #f0cfcd;
  --success: #2f8168; --success-soft: #e9f3f0;
  --warning: #b0801f; --warning-soft: #f8f1e2;
  --info: #3d6fb0; --info-soft: #ebf1f8;
  --sidebar-bg: #f1f1f5; --sidebar-w: 220px; --sidebar-rail-w: 64px;
  --sidebar-border: var(--border); --sidebar-hover: #e6e7ee;
  --sidebar-active: var(--accent-soft); --sidebar-text: var(--text-secondary); --sidebar-text-active: var(--accent);
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px;
  --radius-sm: 6px; --radius: 8px; --radius-md: 10px; --radius-lg: 12px; --radius-xl: 16px;
  --transition-fast: .1s cubic-bezier(.4,0,.2,1);
  --transition: .15s cubic-bezier(.4,0,.2,1);
  --transition-slow: .2s cubic-bezier(.4,0,.2,1);

  /* 布局阈值：导出给 JS 读，不在 JS 里写死 */
  --rail-w: 208px;
  --rail-min-room: 900px;   /* 容器窄于此值则收起右栏，筛选改为浮层 */
  --stream-max: 1200px;      /* 一行一张：正常窗口铺满，最大化时收在这里居中 */
  --memo-max-h: 24vh;        /* 卡片正文高度上限，超出裁掉并渐隐 */
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
               'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.5; letter-spacing: -0.01em;
  background: var(--bg); color: var(--text); overflow: hidden;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility; font-feature-settings: 'kern' 1, 'liga' 1;
}
button, input, textarea { font-family: inherit; }
svg { display: block; flex-shrink: 0; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.15); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.25); }

/* 复用的全局类（摘自 global.css，未改数值） */
.btn-primary {
  padding: 0 var(--space-4); height: 32px; background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all var(--transition); display: inline-flex; align-items: center; gap: var(--space-2);
  white-space: nowrap; box-shadow: var(--shadow-xs);
}
.btn-primary:hover { background: var(--accent-hover); box-shadow: var(--shadow-sm); }
.btn-primary:active { background: var(--accent-active); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn-secondary {
  padding: 0 var(--space-3); height: 32px; background: var(--panel-bg); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all var(--transition); display: inline-flex; align-items: center;
  gap: 6px; white-space: nowrap;
}
.btn-secondary:hover { background: var(--hover); border-color: var(--border-strong); color: var(--text); }
.btn-secondary:active { transform: scale(.98); }
.btn-secondary.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.tab {
  padding: var(--space-1) var(--space-2); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: all var(--transition); color: var(--text-muted); background: transparent; border: none;
  border-radius: var(--radius-sm); white-space: nowrap; display: inline-flex; align-items: center; gap: var(--space-1);
}
.tab:hover { color: var(--text-secondary); background: var(--hover); }
.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tab-count {
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-muted);
  background: var(--hover); border-radius: 999px; padding: 0 5px; min-width: 18px; text-align: center; line-height: 16px;
}
.tab.active .tab-count, .rail-item.active .tab-count { background: var(--accent-light); color: var(--accent); }
.search-box {
  display: flex; align-items: center; gap: var(--space-2); background: var(--panel-bg);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 0 var(--space-3);
  height: 32px; transition: all var(--transition);
}
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.search-box input { flex: 1; border: none; background: none; padding: 0; font-size: 13px; outline: none; color: var(--text); height: 100%; min-width: 0; }
.search-box input::placeholder { color: var(--text-muted); }
.search-icon { color: var(--text-muted); display: flex; align-items: center; }
.search-icon svg { width: 14px; height: 14px; }
.search-clear { display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-radius: 50%; padding: 0; transition: all var(--transition); }
.search-clear:hover { background: var(--hover); color: var(--text-secondary); }
.empty-state { text-align: center; padding: var(--space-8) var(--space-5); color: var(--text-muted); }
.empty-icon { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: var(--radius-lg); background: var(--panel-bg); border: 1px solid var(--border); color: var(--text-muted); opacity: .4; margin-bottom: var(--space-4); }
.empty-icon svg { width: 24px; height: 24px; }
.empty-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: var(--space-1); }
.empty-desc { font-size: 13px; color: var(--text-muted); }

/* ============================================================
   外壳
   ============================================================ */
.app-root { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.titlebar { height: 40px; background: var(--chrome-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; user-select: none; flex-shrink: 0; }
.tb { width: 40px; align-self: stretch; border: none; background: transparent; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition); }
.tb:hover { background: var(--hover); color: var(--text); }
.tb.danger:hover { background: var(--danger); color: #fff; }
.spacer { flex: 1; }
.app-layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }
.sidebar { width: var(--sidebar-rail-w); background: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; align-items: center; padding: var(--space-3) 0; gap: var(--space-1); flex-shrink: 0; }
.sidebar-logo { width: 28px; height: 28px; margin-bottom: var(--space-4); }
.nav-item { width: 40px; height: 40px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--sidebar-text); cursor: pointer; transition: all var(--transition); border: none; background: transparent; }
.nav-item:hover { background: var(--sidebar-hover); color: var(--text); }
.nav-item.active { background: var(--sidebar-active); color: var(--sidebar-text-active); }
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); min-height: 0; }

/* ============================================================
   页面：单栏流 + 右窄栏（唯一书写面在流里）
   ============================================================ */
.notes-page { flex: 1; display: flex; min-height: 0; overflow: hidden; }

.stream { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.stream-inner {
  width: 100%; max-width: var(--stream-max); margin: 0 auto;
  padding: var(--space-5) var(--space-5) 96px;
}

/* ---------- 顶部工具条（唯一一条 chrome） ---------- */
.stream-bar {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) 0 var(--space-3);
  margin-bottom: var(--space-1);
}
.stream-bar .search-box { flex: 1; min-width: 80px; max-width: 320px; }
.bar-count { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; margin-right: auto; padding-left: var(--space-1); }
.bar-btn { height: 32px; padding: 0 var(--space-2); border: 1px solid transparent; background: transparent; border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all var(--transition); white-space: nowrap; }
.bar-btn:hover { background: var(--hover); }
.bar-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

/* ---------- 输入区：流的第一个元素 ----------
   交互契约（与 NoteComposer.vue 一致）：点开后失焦不收回，只有空内容按 Esc 才收回胶囊态 */
.composer {
  background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xs); transition: all var(--transition); margin-bottom: var(--space-5);
}
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring), var(--shadow-sm); }
.composer-input {
  padding: var(--space-4) var(--space-4) var(--space-2); outline: none; cursor: text;
  font-size: 14.5px; line-height: 1.75; color: var(--text); min-height: 46px; max-height: 46vh; overflow-y: auto;
  word-break: break-word;
}
.composer-input.is-empty::before { content: attr(data-ph); color: var(--text-muted); pointer-events: none; }
.composer-bar {
  display: flex; align-items: center; gap: var(--space-1); padding: var(--space-2) var(--space-3);
  border-top: 1px solid var(--border);
}
.composer-hint { font-size: 11px; color: var(--text-muted); margin-left: var(--space-1); }
.composer-bar .spacer { flex: 1; }
.mini-btn {
  height: 26px; padding: 0 var(--space-2); border: none; background: transparent; border-radius: var(--radius-sm);
  color: var(--text-muted); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all var(--transition);
}
.mini-btn:hover { background: var(--hover); color: var(--text-secondary); }
.mini-btn.on { color: var(--accent); background: var(--accent-soft); }
.kbd { font-size: 10.5px; font-family: 'SF Mono','Cascadia Code',monospace; color: var(--text-muted); background: var(--hover); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; line-height: 15px; }

/* 标签内联渲染（flomo 式：#标签 直接在正文里着色，不占独立行） */
.ti { color: var(--accent); font-weight: 500; cursor: pointer; border-radius: 3px; padding: 0 1px; transition: background var(--transition); }
.ti:hover { background: var(--accent-soft); }

/* ---------- 日期分组 ---------- */
.day { margin-bottom: var(--space-4); }
.day-head {
  position: sticky; top: 44px; z-index: 10; display: flex; align-items: center; gap: var(--space-2);
  font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: .02em;
  padding: var(--space-2) 0 var(--space-2) var(--space-1); background: var(--bg);
}
.day-head.pinned { color: var(--accent); }
.day-head::after { content: ''; flex: 1; height: 1px; background: var(--border); opacity: .7; }
.day-head .day-count { font-variant-numeric: tabular-nums; font-weight: 500; }
.day-list { display: flex; flex-direction: column; gap: var(--space-2); }

/* ---------- 小记卡片 ---------- */
.memo {
  position: relative; background: var(--panel-bg); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4);
  box-shadow: var(--shadow-xs); transition: box-shadow var(--transition), border-color var(--transition), transform var(--transition);
}
.memo:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.memo.pinned { border-color: var(--accent-light); }
.memo.editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring), var(--shadow-sm); }
.memo.newborn { animation: born var(--transition-slow) cubic-bezier(.34,1.56,.64,1) both; }
@keyframes born { from { opacity: 0; transform: translateY(-6px) scale(.99); } }

.memo-body { font-size: 13.5px; line-height: 1.75; color: var(--text); word-break: break-word; outline: none; }
.memo-body > * + * { margin-top: var(--space-2); }
.memo-body h2 { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; }
.memo-body h3 { font-size: 14px; font-weight: 600; }
.memo-body strong { font-weight: 600; }
.memo-body ul, .memo-body ol { padding-left: var(--space-5); }
.memo-body li { margin: 1px 0; }
.memo-body li::marker { color: var(--text-muted); }
.memo-body blockquote { border-left: 2px solid var(--accent-light); padding-left: var(--space-3); color: var(--text-secondary); }
.memo-body code { font-family: 'SF Mono','Cascadia Code',monospace; font-size: 12px; background: var(--hover); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; color: var(--accent-active); }
.memo-body pre { font-family: 'SF Mono','Cascadia Code',monospace; font-size: 12px; line-height: 1.65; background: #f6f7f9; border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-2) var(--space-3); overflow-x: auto; color: #4c4f69; }
.memo-body pre code { background: none; border: none; padding: 0; color: inherit; }
.memo-body .todo { list-style: none; padding-left: 0; display: flex; flex-direction: column; gap: 3px; }
.memo-body .todo li { display: flex; align-items: flex-start; gap: var(--space-2); }
.memo-body .todo input { accent-color: var(--accent); margin-top: 5px; }
.memo-body .todo input:checked + span { color: var(--text-muted); text-decoration: line-through; }
.memo-body hr { border: none; border-top: 1px solid var(--border); }

/* 折叠：正文按视口比例封顶，短的小记按实际高度，超出才裁掉并在末尾渐隐（单击展开读全文） */
.memo-body { position: relative; max-height: var(--memo-max-h); overflow: hidden; cursor: pointer; }
.memo-body.expanded { max-height: none; }
.memo.editing .memo-body { cursor: text; }
.memo-body.clipping::after {
  /* 裁切边界可能落在段落空隙上，固定 32px 会糊在空白里看不见：按三行给，再被封顶高度的一半收住 */
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: min(5.25em, calc(var(--memo-max-h) / 2));
  background: linear-gradient(to bottom, transparent, var(--panel-bg) 72%); pointer-events: none;
}

.memo-foot { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); min-height: 22px; }
.memo-time { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.memo-att { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-muted); }
.memo-state { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--text-muted); }
.memo-foot .spacer { flex: 1; }
.memo-acts { display: flex; gap: 1px; opacity: 0; transition: opacity var(--transition); }
.memo:hover .memo-acts, .memo:focus-within .memo-acts, .memo.editing .memo-acts { opacity: 1; }
.ib { width: 24px; height: 24px; border: none; background: transparent; border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: all var(--transition); }
.ib:hover { background: var(--hover); color: var(--text-secondary); }
.ib:active { transform: scale(.9); }
.ib.on { color: var(--accent); }
.ib.on.warn { color: var(--warning); }
.ib.danger:hover { color: var(--danger); background: var(--danger-soft); }

/* 编辑态下的卡片底栏 —— 与新建态同一套操作，不出现「先保存再补」 */
.edit-bar { display: flex; align-items: center; gap: var(--space-1); margin-top: var(--space-3); padding-top: var(--space-2); border-top: 1px dashed var(--border); flex-wrap: wrap; }
.edit-bar .spacer { flex: 1; }
.eb { height: 26px; padding: 0 var(--space-2); border: 1px solid var(--border); background: var(--panel-bg); border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all var(--transition); white-space: nowrap; }
.eb:hover { border-color: var(--border-strong); color: var(--text); background: var(--hover); }
.eb.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.eb.danger { color: var(--danger); }
.eb.danger:hover { background: var(--danger-soft); border-color: #fecaca; }
.eb.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.eb.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
.save-hint { font-size: 11px; color: var(--text-muted); }
.save-hint.saving { color: var(--warning); }

/* 附件条 */
.att-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-3); }
.att { position: relative; width: 76px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: all var(--transition); }
.att:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.att-thumb { height: 56px; }
.att-name { font-size: 9.5px; color: var(--text-secondary); padding: 2px var(--space-1) 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.att-size { font-size: 9.5px; color: var(--text-muted); padding: 0 var(--space-1) var(--space-1); }
.att-del { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border: none; border-radius: 4px; background: rgba(17,24,39,.6); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; transition: opacity var(--transition); padding: 0; }
.att:hover .att-del { opacity: 1; }
.att-del:hover { background: var(--danger); }

/* 批量复选框 */
.memo.batchable { padding-left: var(--space-8); }
.memo-check { position: absolute; left: var(--space-3); top: var(--space-3); width: 16px; height: 16px; border: 1.5px solid var(--border-strong); border-radius: 4px; background: var(--panel-bg); display: flex; align-items: center; justify-content: center; cursor: pointer; color: transparent; transition: all var(--transition); }
.memo-check:hover { border-color: var(--accent); }
.memo-check.checked { background: var(--accent); border-color: var(--accent); color: #fff; }
.memo.is-sel { border-color: var(--accent); background: var(--accent-soft); }

/* 批量底栏 */
.batch-dock {
  position: fixed; bottom: var(--space-5); left: 50%; transform: translateX(-50%); z-index: 120;
  display: flex; align-items: center; gap: var(--space-1);
  background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-pop); padding: var(--space-2);
  animation: dock-in var(--transition-slow) cubic-bezier(.22,1,.36,1) both;
}
@keyframes dock-in { from { opacity: 0; transform: translate(-50%, 10px); } }
.dock-count { font-size: 12px; font-weight: 600; color: var(--accent); padding: 0 var(--space-2); white-space: nowrap; }
.dock-sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 var(--space-1); }
.dock-btn { height: 28px; padding: 0 var(--space-2); border: 1px solid transparent; background: transparent; border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all var(--transition); white-space: nowrap; }
.dock-btn:hover { background: var(--hover); border-color: var(--border); color: var(--text); }
.dock-btn:disabled { opacity: .4; cursor: not-allowed; }
.dock-btn.danger { color: var(--danger); }
.dock-btn.danger:hover { background: var(--danger-soft); border-color: #fecaca; }

/* ---------- 右窄栏：视图 + 标签（纯导航，不是书写面） ---------- */
.rail {
  width: var(--rail-w); flex-shrink: 0; border-left: 1px solid var(--border); background: var(--sidebar-bg);
  overflow-y: auto; padding: var(--space-4) var(--space-2) var(--space-5);
}
.rail-title { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: .02em; padding: 0 var(--space-2) var(--space-2); }
.rail-item {
  display: flex; align-items: center; gap: var(--space-2); width: 100%; padding: 5px var(--space-2);
  border: none; background: transparent; border-radius: var(--radius-sm); font-size: 13px; color: var(--text-secondary);
  cursor: pointer; transition: all var(--transition); text-align: left;
}
.rail-item:hover { background: var(--sidebar-hover); color: var(--text); }
.rail-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.rail-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-sep { height: 1px; background: var(--border); margin: var(--space-3) var(--space-2); }
.rail-empty { font-size: 12px; color: var(--text-muted); padding: 0 var(--space-2); }

/* ---------- 浮层 ---------- */
.popover { position: fixed; z-index: 200; background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); padding: var(--space-1); min-width: 148px; animation: pop var(--transition-fast) ease both; }
@keyframes pop { from { opacity: 0; transform: translateY(-3px) scale(.98); } }
.pop-item { display: flex; align-items: center; gap: var(--space-2); width: 100%; padding: var(--space-2) var(--space-3); border: none; background: transparent; border-radius: var(--radius-sm); font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all var(--transition); text-align: left; white-space: nowrap; }
.pop-item:hover { background: var(--hover); color: var(--text); }
.pop-item.danger { color: var(--danger); }
.pop-item.danger:hover { background: var(--danger-soft); }
.pop-sep { height: 1px; background: var(--border); margin: var(--space-1) var(--space-2); }
.pop-wide { min-width: 260px; padding: 0; }
.pop-sec { padding: var(--space-3) var(--space-4); }
.pop-sec + .pop-sec { border-top: 1px solid var(--border); }
.pop-label { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: .02em; margin-bottom: var(--space-2); }
.pop-tabs { display: flex; flex-wrap: wrap; gap: var(--space-1); }

/* slash 命令菜单（就地编辑时也提供）：裸图标 + 名称 + markdown 触发符 */
.slash-menu { position: fixed; z-index: 210; width: 208px; padding: 4px; overflow-y: auto; background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); animation: pop var(--transition-fast) ease both; }
.slash-item { display: flex; align-items: center; gap: var(--space-2); width: 100%; padding: 5px 7px; border: none; background: transparent; border-radius: var(--radius); font-size: 13px; color: var(--text); text-align: left; cursor: pointer; transition: background var(--transition-fast); }
.sm-icon { display: inline-flex; align-items: center; width: 15px; flex-shrink: 0; color: var(--text-secondary); }
.sm-badge { width: 15px; flex-shrink: 0; text-align: center; font-size: 10.5px; font-weight: 700; letter-spacing: -.03em; color: var(--text-secondary); }
.sm-label { flex: 1; min-width: 0; }
.sm-hint { font-family: 'SF Mono','Cascadia Code',monospace; font-size: 10.5px; color: var(--text-faint); white-space: nowrap; }
.sm-empty { padding: 9px 7px; font-size: 12.5px; color: var(--text-muted); }
.slash-item.active { background: var(--accent-soft); }
.slash-item.active .sm-label { color: var(--accent-active); font-weight: 500; }
.slash-item.active .sm-icon, .slash-item.active .sm-badge { color: var(--accent-active); }
.slash-item.active .sm-hint { color: var(--accent-active); opacity: .6; }

/* 确认框 / toast */
.dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 300; animation: fade var(--transition-slow) both; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: var(--panel-bg); border-radius: var(--radius-lg); width: 360px; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; animation: din var(--transition-slow) ease both; }
@keyframes din { from { opacity: 0; transform: scale(.97) translateY(6px); } }
.dialog-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.dialog-header h3 { font-size: 14px; font-weight: 600; }
.dialog-body { padding: var(--space-4) var(--space-5); font-size: 13px; color: var(--text-secondary); white-space: pre-line; }
.dialog-footer { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-4) var(--space-4); }
.btn-ghost { height: 32px; padding: 0 var(--space-3); background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-secondary); font-size: 13px; cursor: pointer; transition: all var(--transition); }
.btn-ghost:hover { background: var(--hover); color: var(--text); }
.btn-danger { height: 32px; padding: 0 var(--space-4); background: var(--danger); border: none; border-radius: var(--radius); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; transition: all var(--transition); }
.btn-danger:hover { background: var(--danger-hover); }
.toast { position: fixed; bottom: var(--space-6); left: 50%; transform: translateX(-50%); background: #0f172a; font-size: 13px; padding: var(--space-2) var(--space-4); border-radius: var(--radius); box-shadow: var(--shadow-lg); z-index: 400; animation: tin var(--transition-slow) cubic-bezier(.22,1,.36,1) both; }
.toast.success { color: #6ee7b7; } .toast.info { color: #a5b4fc; }
@keyframes tin { from { opacity: 0; transform: translate(-50%, 8px); } }

/* 焦点可见性 */
:where(button,[tabindex],input,[contenteditable]):focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }
.memo:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); }

/* 原型说明 */
.proto { position: fixed; bottom: var(--space-4); right: var(--space-4); z-index: 500; }
.proto-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--panel-bg); color: var(--text-secondary); font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-md); }
.proto-btn:hover { color: var(--accent); border-color: var(--accent); }
.proto-panel { position: fixed; bottom: 56px; right: var(--space-4); width: 348px; max-height: 62vh; overflow-y: auto; background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); padding: var(--space-4); font-size: 12px; color: var(--text-secondary); line-height: 1.75; z-index: 500; }
.proto-panel h4 { font-size: 13px; color: var(--text); margin-bottom: var(--space-2); }
.proto-panel ul { padding-left: var(--space-4); display: flex; flex-direction: column; gap: 2px; }
.proto-panel .sec { margin-top: var(--space-3); }
.proto-panel .warn { color: var(--danger); font-weight: 600; }
.proto-panel code { font-family: 'SF Mono',monospace; background: var(--hover); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>

NOTES.forEach(n => { n.title = deriveTitle(n.html); n.text = strip(n.html); n.tags = extractTags(n.html); });

/* ================= 状态 ================= */
const S = {
  q: '', view: 'all', tags: new Set(), sort: 'new',
  batch: false, sel: new Set(),
  editing: null,            // 就地展开的 note id；null = 浏览态
  exp: new Set(),           // 单击展开（只为读全文，不是编辑）的 note id
  draft: '',                // 编辑中的 html
  newborn: null,
  saveState: '',
  rail: true,               // 右栏是否常驻（窄于此阈值改为筛选浮层）
  pop: null,
};
const VIEWS = [['all','全部'],['pinned','置顶'],['starred','收藏']];
const SORTS = [['new','最新'],['old','最早'],['updated','最近更新']];
const counts = () => ({
  all: NOTES.length,
  pinned: NOTES.filter(n => n.pinned).length,
  starred: NOTES.filter(n => n.starred).length,
});
const tagCounts = () => { const m = new Map(); NOTES.forEach(n => n.tags.forEach(t => m.set(t, (m.get(t)||0)+1))); return [...m.entries()].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0])); };
function visible() {
  let r = NOTES.slice();
  if (S.q) { const q = S.q.toLowerCase(); r = r.filter(n => n.text.toLowerCase().includes(q)); }
  if (S.view === 'pinned') r = r.filter(n => n.pinned);
  if (S.view === 'starred') r = r.filter(n => n.starred);
  if (S.tags.size) r = r.filter(n => n.tags.some(t => S.tags.has(t)));
  r.sort((a,b) => S.sort === 'old' ? a.created_at - b.created_at : S.sort === 'updated' ? b.updated_at - a.updated_at : b.created_at - a.created_at);
  return r;
}
function days(list) {
  const out = []; const pin = list.filter(n => n.pinned);
  if (pin.length) out.push({ label: '置顶', pinned: true, items: pin });
  const rest = list.filter(n => !n.pinned); const b = new Map();
  rest.forEach(n => { const g = groupOf(n.created_at); if (!b.has(g)) b.set(g, []); b.get(g).push(n); });
  ['今天','昨天','本周','本月','更早'].forEach(l => { if (b.get(l)?.length) out.push({ label: l, items: b.get(l) }); });
  return out;
}
const byId = id => NOTES.find(n => n.id === id);
const filtering = () => S.q || S.view !== 'all' || S.tags.size > 0;

/* ================= 渲染 ================= */
const $page = document.getElementById('page'), $over = document.getElementById('over');

/** 上限是视口比例：量一遍才知道哪张卡真的被裁掉，只有裁掉的了才铺渐隐 */

function renderPage() {

function composer() {
  return `<section class="composer" id="composer">

function rail() {

function dock() {

function dayBlock(d) {

function memo(n) {

/* 就地展开：与新建态同一套操作 —— 图片/标签/置顶/收藏/删除 全在这里，不需要「先保存再补」 */

/* ================= 浮层 ================= */
function renderPop() {
  $over.querySelectorAll('.popover').forEach(e => e.remove());
  if (!S.pop) return;
  const p = document.createElement('div');
  p.className = 'popover' + (['filter','sort'].includes(S.pop.kind) ? ' pop-wide' : '');
  p.innerHTML = S.pop.kind === 'filter' ? filterPop() : S.pop.kind === 'sort' ? sortPop() : menuPop(byId(S.pop.id));
  $over.appendChild(p); place(p, S.pop.anchor);
}
function place(el, a) {
  const r = a.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8));
  let top = r.bottom + 6;
  if (innerHeight - r.bottom < h + 16) top = Math.max(8, r.top - h - 6);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
function menuPop(n) {
  const it = (a, i, l, c = '') => `<button class="pop-item ${c}" data-act="${a}" data-id="${n.id}">${svg(i,14)}${l}</button>`;
  return it('copy', I.doc, '复制文本') + `<div class="pop-sep"></div>` + it('del', I.trash, '删除', 'danger');
}
function filterPop() {
  const c = counts(), tg = tagCounts();

    ${VIEWS.map(([v,l]) => `<button class="tab ${S.view===v?'active':''}" data-act="view" data-v="${v}">${l}<span class="tab-count">${c[v]}</span></button>`).join('')}</div></div>
  <div class="pop-sec"><div class="pop-label">标签 · ${S.tags.size ? `已选 ${S.tags.size}` : '可多选'}</div>
    <div class="pop-tabs">${tg.map(([t,k]) => `<button class="tab ${S.tags.has(t)?'active':''}" data-act="ftoggle" data-tag="${esc(t)}">#${esc(t)}<span class="tab-count">${k}</span></button>`).join('')}</div></div>
  ${filtering() ? `<div class="pop-sec" style="padding-top:0"><button class="tab" data-act="clearfilters" style="color:var(--danger)">清空筛选</button></div>` : ''}`;
}
function sortPop() {
  return `<div class="pop-sec"><div class="pop-label">排序</div><div class="pop-tabs">
    ${SORTS.map(([v,l]) => `<button class="tab ${S.sort===v?'active':''}" data-act="sort" data-v="${v}">${l}</button>`).join('')}</div></div>`;

/* ================= 行为 ================= */
let confirmCb = null;
function confirmBox(title, msg, ok) {
  confirmCb = ok;
  $over.insertAdjacentHTML('beforeend', `<div class="dialog-overlay"><div class="dialog" role="dialog" aria-modal="true">
    <div class="dialog-header"><h3>${esc(title)}</h3></div><div class="dialog-body">${esc(msg)}</div>
    <div class="dialog-footer"><button class="btn-ghost" data-act="ccancel">取消</button><button class="btn-danger" data-act="cok">确定</button></div></div></div>`);
}
let toastT;
function toast(m, t = 'success') { $over.querySelector('.toast')?.remove(); const e = document.createElement('div'); e.className = 'toast ' + t; e.textContent = m; $over.appendChild(e); clearTimeout(toastT); toastT = setTimeout(() => e.remove(), 2000); }

function startEdit(id) { const n = byId(id); S.editing = id; S.draft = n.html; S.saveState = ''; render(); focusCaretEnd(document.getElementById('editBody')); }
function commitEdit() {
  if (!S.editing) return;
  const n = byId(S.editing);
  const raw = document.getElementById('editBody')?.innerHTML || S.draft;
  n.html = stripTagsKeep(raw); n.text = strip(n.html); n.tags = extractTags(n.html); n.title = deriveTitle(n.html); n.updated_at = Date.now();
  S.editing = null; S.saveState = ''; render();
}
function stripTagsKeep(html) { return html.replace(/<span class="ti"[^>]*>(#[\w\u4e00-\u9fa5]+)<\/span>/g, '$1'); }
function focusCaretEnd(el) { if (!el) return; el.focus(); const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

function publish() {
  const cin = document.getElementById('cin'); const html = cin.innerHTML;
  if (!strip(html).trim()) return;
  const n = mk({ created_at: Date.now(), updated_at: Date.now(), html });
  n.title = deriveTitle(html); n.text = strip(html); n.tags = extractTags(html);
  NOTES.unshift(n); S.newborn = n.id;
  cin.innerHTML = ''; cin.classList.add('is-empty'); document.querySelector('[data-act="publish"]').disabled = true;
  render(); cin.focus();
  setTimeout(() => { S.newborn = null; }, 400);
}
function togglePin(id) { const n = byId(id); n.pinned = !n.pinned; render(); }
function toggleStar(id) { const n = byId(id); n.starred = !n.starred; render(); }
function delNote(id) {
  const n = byId(id);
  confirmBox('确认删除', `确定删除这条小记吗？\n\n“${n.text.slice(0, 40)}…”`, () => {
    NOTES.splice(NOTES.indexOf(n), 1); if (S.editing === id) S.editing = null; S.sel.delete(id); render(); toast('已删除', 'info');
  });
}
const eachSel = fn => { if (!S.sel.size) return; [...S.sel].forEach(i => fn(byId(i))); render(); };

function wirePage() {
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', e => { S.q = e.target.value; const p = e.target.selectionStart; renderPage(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(p, p); });
  const cin = document.getElementById('cin');
  if (cin) {
    cin.addEventListener('input', () => {
      cin.classList.toggle('is-empty', !strip(cin.innerHTML).trim());
      document.querySelector('[data-act="publish"]').disabled = !strip(cin.innerHTML).trim();
      autoGrow(cin);
      handleSlash(cin);
    });
    cin.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); publish(); } });
  }
  const eb = document.getElementById('editBody');
  if (eb) {
    eb.addEventListener('input', () => {
      S.draft = eb.innerHTML; const n = byId(S.editing);
      n.html = stripTagsKeep(eb.innerHTML); n.text = strip(n.html); n.tags = extractTags(n.html); n.title = deriveTitle(n.html); n.updated_at = Date.now();
      S.saveState = 'saving'; clearTimeout(eb._t);
      eb._t = setTimeout(() => { S.saveState = 'saved'; const h = document.querySelector('.save-hint'); if (h) { h.className = 'save-hint ' + S.saveState; h.textContent = '已保存'; } setTimeout(() => { const h2 = document.querySelector('.save-hint'); if (h2) { h2.className = 'save-hint'; h2.textContent = '自动保存'; } }, 1500); }, 500);
    });
    eb.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); commitEdit(); } if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); commitEdit(); } });
    focusCaretEnd(eb);
  }
}
function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, innerHeight * 0.46) + 'px'; }

/* slash 命令：在流里就地编辑时也提供（真实实现走 Tiptap） */
let slash = null, slashIdx = 0, slashItems = [];
const SLASH = [
  { l: '标题 1', b: 'H1', h: '#', k: 'h1 heading biaoti' },
  { l: '标题 2', b: 'H2', h: '##', k: 'h2 heading biaoti' },
  { l: '标题 3', b: 'H3', h: '###', k: 'h3 heading biaoti' },
  { l: '无序列表', i: 'bulletlist', h: '-', k: 'bullet ul liebiao wuxu' },
  { l: '有序列表', i: 'orderedlist', h: '1.', k: 'ordered ol number liebiao youxu' },
  { l: '任务列表', i: 'checkall', h: '[]', k: 'task todo checkbox renwu' },
  { l: '引用', i: 'quote', h: '>', k: 'quote blockquote yinyong' },
  { l: '代码块', i: 'code', h: '```', k: 'code pre daimaku' },
  { l: '分割线', i: 'divider', h: '---', k: 'hr divider fengexian' },
];
function openSlash(el, q) {
  const query = q.toLowerCase();
  slashItems = SLASH.filter(c => !query || c.l.toLowerCase().includes(query) || c.k.includes(query));
  slashIdx = 0;
  if (!slash) { slash = document.createElement('div'); slash.className = 'slash-menu'; $over.appendChild(slash); }
  const row = (c, i) => `<button class="slash-item${i === 0 ? ' active' : ''}" data-slash="${c.l}" data-i="${i}">
      ${c.i ? `<span class="sm-icon">${svg(I[c.i], 15)}</span>` : `<span class="sm-badge">${c.b}</span>`}
      <span class="sm-label">${c.l}</span><span class="sm-hint">${c.h}</span></button>`;
  slash.innerHTML = slashItems.length
    ? slashItems.map(row).join('')
    : `<div class="sm-empty">没有匹配的块</div>`;
  const r = el.getBoundingClientRect();
  slash.style.left = Math.max(12, Math.min(r.left, innerWidth - 220)) + 'px';
  const below = innerHeight - r.bottom - 18, above = r.top - 18;
  if (below >= 168 || below >= above) {
    slash.style.bottom = 'auto'; slash.style.top = (r.bottom + 6) + 'px'; slash.style.maxHeight = below + 'px';
  } else {
    slash.style.top = 'auto'; slash.style.bottom = (innerHeight - r.top + 6) + 'px'; slash.style.maxHeight = above + 'px';
  }
}
function moveSlash(d) {
  if (!slash || !slashItems.length) return;
  const len = slashItems.length;
  slashIdx = (slashIdx + d + len) % len;
  slash.querySelectorAll('.slash-item').forEach(el => el.classList.toggle('active', +el.dataset.i === slashIdx));
  slash.querySelector('.slash-item.active')?.scrollIntoView({ block: 'nearest' });
}
function applySlash(label) {
  const cin = document.getElementById('cin');
  if (cin && label) { cin.innerHTML = cin.innerHTML.replace(/\/[\u4e00-\u9fa5\w]*$/, '') + `<p>［已应用：${label}］</p>`; cin.dispatchEvent(new Event('input')); }
  closeSlash();
}
function handleSlash(el) {
  const t = el.textContent; const m = t.match(/\/([\u4e00-\u9fa5\w]*)$/);
  if (m) { openSlash(el, m[1]); } else if (slash) { closeSlash(); }
}
function closeSlash() { if (slash) { slash.remove(); slash = null; slashItems = []; slashIdx = 0; } }
$over.addEventListener('click', e => {
  const s = e.target.closest('[data-slash]'); if (!s) return;
  applySlash(s.dataset.slash);
});

/** 单击要等过双击窗口才生效，否则双击会先被当成展开 */
let expTimer = null;
document.addEventListener('dblclick', e => {
  const card = e.target.closest('.memo');
  if (!card || S.batch || !e.target.closest('.memo-body')) return;
  clearTimeout(expTimer);
  startEdit(card.dataset.id);
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case 'editnow': startEdit(id); break;
    case 'expand': {
      if (S.batch) { S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); break; }
      clearTimeout(expTimer);
      expTimer = setTimeout(() => {
        const el = document.querySelector(`.memo-body[data-body="${id}"]`);
        if (S.exp.has(id)) S.exp.delete(id);
        else if (el?.classList.contains('clipping')) S.exp.add(id);
        render();
      }, 230);
      break;
    }
    case 'done': commitEdit(); break;
    case 'pin': togglePin(id); break;
    case 'star': toggleStar(id); break;
    case 'del': delNote(id); break;
    case 'copy': toast('已复制到剪贴板'); S.pop = null; renderPop(); break;
    case 'menu': S.pop = S.pop?.kind === 'menu' && S.pop.id === id ? null : { kind: 'menu', anchor: t, id }; renderPop(); break;
    case 'eimg': case 'cimg': { const n = byId(id || null) || null; const target = id ? byId(id) : null;
      if (target) { target.atts.unshift({ id: 'a' + Date.now(), name: `image-${target.atts.length + 1}.png`, size: 42000 + target.atts.length * 15000, g: 'linear-gradient(135deg,#e0e7ff,#a5b4fc)' }); render(); }
      else toast('真实环境走 plugin-dialog 选图 → upload_attachment', 'info'); break; }
    case 'etag': case 'ctag': { const el = document.getElementById(a === 'etag' ? 'editBody' : 'cin'); if (el) { el.innerHTML += ' #'; el.dispatchEvent(new Event('input')); el.focus(); } break; }
    case 'adel': { const n = byId(id); n.atts = n.atts.filter(x => x.id !== t.dataset.aid); render(); break; }
    case 'publish': publish(); break;
    case 'clearq': S.q = ''; render(); break;
    case 'clearfilters': S.q = ''; S.view = 'all'; S.tags.clear(); S.pop = null; render(); break;
    case 'view': S.view = t.dataset.v; S.pop = null; render(); break;
    case 'sort': S.sort = t.dataset.v; S.pop = null; render(); break;
    case 'sortpop': S.pop = S.pop?.kind === 'sort' ? null : { kind: 'sort', anchor: t }; renderPop(); break;
    case 'filterpop': S.pop = S.pop?.kind === 'filter' ? null : { kind: 'filter', anchor: t }; renderPop(); break;
    case 'ftag': S.tags.clear(); S.tags.add(t.dataset.tag); render(); break;
    case 'ftoggle': S.tags.has(t.dataset.tag) ? S.tags.delete(t.dataset.tag) : S.tags.add(t.dataset.tag); if (S.pop?.kind === 'filter') { /* 保留浮层 */ } render(); break;
    case 'batch': S.batch = !S.batch; S.sel.clear(); S.editing = null; render(); break;
    case 'tsel': S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); break;
    case 'selall': visible().forEach(n => S.sel.add(n.id)); render(); break;
    case 'selnone': S.sel.clear(); render(); break;
    case 'bdone': S.batch = false; S.sel.clear(); render(); break;
    case 'bpin': eachSel(n => n.pinned = true); toast('已批量置顶'); break;
    case 'bunpin': eachSel(n => n.pinned = false); toast('已批量取消置顶'); break;
    case 'bstar': eachSel(n => n.starred = true); toast('已批量收藏'); break;
    case 'bunstar': eachSel(n => n.starred = false); toast('已批量取消收藏'); break;
    case 'bdel': { const c = S.sel.size; confirmBox('确认删除', `确定删除选中的 ${c} 条小记吗？此操作不可撤销。`, () => { [...S.sel].forEach(i => { const n = byId(i); if (n) NOTES.splice(NOTES.indexOf(n), 1); }); S.sel.clear(); S.batch = false; render(); toast(`已删除 ${c} 条`, 'info'); }); break; }
    case 'cok': { const f = confirmCb; $over.querySelector('.dialog-overlay')?.remove(); confirmCb = null; f && f(); break; }
    case 'ccancel': $over.querySelector('.dialog-overlay')?.remove(); confirmCb = null; break;
  }
});
document.addEventListener('mousedown', e => {
  if (!S.pop) return;
  if (e.target.closest('.popover') || e.target.closest('[data-act="menu"],[data-act="filterpop"],[data-act="sortpop"]')) return;
  S.pop = null; renderPop();
});
document.addEventListener('scroll', () => { if (S.pop) { S.pop = null; renderPop(); } closeSlash(); }, true);
document.addEventListener('keydown', e => {
  if (slash) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSlash(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveSlash(-1); return; }
    if (e.key === 'Enter') { e.preventDefault(); applySlash(slashItems[slashIdx]?.l); return; }
  }
  if (e.key === 'Escape') {
    if (slash) { closeSlash(); return; }
    if ($over.querySelector('.dialog-overlay')) { $over.querySelector('.dialog-overlay')?.remove(); confirmCb = null; return; }
    if (S.pop) { S.pop = null; renderPop(); return; }
    if (S.editing) { commitEdit(); return; }
    if (S.batch) { S.batch = false; S.sel.clear(); render(); }
    return;
  }
  if (e.key === 'Enter' && e.target.classList?.contains('memo') && !S.batch) { e.preventDefault(); startEdit(e.target.dataset.id); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('q')?.focus(); }
});

/* 响应式：容器窄于阈值时收起右栏，筛选降级为浮层 */
const rootCs = getComputedStyle(document.documentElement);
const ROOM = parseFloat(rootCs.getPropertyValue('--rail-min-room')) || 900;
new ResizeObserver(es => {
  const w = es[0].contentRect.width;
  const next = w >= ROOM;
  if (next !== S.rail) { S.rail = next; render(); }   // 值未变不重渲染 —— caa75da 的死循环防护
}).observe($page);

document.getElementById('protoBtn').onclick = () => {
  const o = $over.querySelector('.proto-panel'); if (o) { o.remove(); return; }
  const d = document.createElement('div'); d.className = 'proto-panel';
  d.innerHTML = `<h4>小记原型 v2 · 单栏流 + 就地展开</h4>
    <div>参照 <b>flomo</b>（官方文档确认：备忘录在时间线里<b>就地编辑</b>，输入框像聊天框常驻）与 <b>Google Keep</b>（输入框是网格的第一个元素）。<b>全站只有一个书写面</b> —— 就是这条流。</div>
    <div class="sec"><b>和上一版的根本差别：</b>删掉了右侧编辑栏。左栏输入框不再是「简版」，它和就地展开的编辑态是<b>同一套操作</b>（图片 / 标签 / 置顶 / 收藏 / 删除），不存在「先发布再补附件」。</div>
    <div class="sec"><b>请重点试：</b><ul>
      <li>顶部输入 → 敲 <code>#测试</code> 会内联变蓝；回车换行；<code>Ctrl+Enter</code> 发布，新卡片直接长在流顶部并弹一下</li>
      <li>输入 <code>/</code> 出命令菜单</li>
      <li>双击任意一条（或点悬停出现的铅笔）→ <b>原位展开</b>成编辑态，改字 500ms 后显示「已保存」，<code>Esc</code> 或「完成」收起</li>
      <li>超长那条（最早）正文按 40vh 封顶，底部渐隐，<b>单击就地展开全文</b>；双击或悬停行的铅笔图标才进编辑</li>
      <li>#标签 直接点 → 立刻筛选；右栏标签可多选，带计数</li>
      <li>把窗口拖窄到 900px 以下 → 右栏收起，筛选降级成工具栏的「筛选」浮层</li>
      <li>批量 → 底部浮出操作坞，含取消全选 / 取消置顶 / 取消收藏</li>
      <li>Tab 走一遍：输入框 → 工具栏 → 每条卡片 → 卡片操作 → 菜单项</li>
    </ul></div>
    <div class="sec"><b>约束：</b>不新增 IPC、不改 schema。<code>src-tauri</code> 里 12 个命令共用一把 mutex，所以附件数只在点开时取。</div>
    <div class="sec" style="color:var(--text-muted)">真实实现里正文编辑用现成的 Tiptap <code>NoteEditor</code>（slash 菜单/代码语言选择已有），这里用 contenteditable 代替。</div>`;
  $over.appendChild(d);
};

render();
document.getElementById('cin')?.focus();
</script>
