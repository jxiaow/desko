<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desko · 小记 — 青瓷质感完整原型</title>
<style>
/* ============================================================
   令牌 —— 逐字采用本轮规格色值，不映射仓库既有主题
   ============================================================ */
:root {
  --bg-app: #f4f7f5;
  --bg-sidebar: #ebf0ed;
  --bg-surface: #ffffff;
  --bg-drawer: #fafcfa;

  --border-base: #d4ded8;
  --border-card: #dde5e0;
  --border-card-hover: #c5d1ca;

  --text-main: #0c1410;
  --text-muted: #36473e;
  --text-dim: #5c7265;

  --brand: #1d5e40;
  --brand-hover: #154831;
  --brand-soft: #e6efe9;
  --brand-wash: #eef4f0;
  --brand-ring: rgba(29, 94, 64, 0.16);

  --warn: #b45309;
  --warn-bg: #fef3c7;
  --danger: #dc2626;
  --danger-bg: #fef2f2;

  --overlay: rgba(12, 20, 16, 0.42);

  --shadow-xs: 0 1px 2px rgba(12, 20, 16, .05);
  --shadow-sm: 0 1px 3px rgba(12, 20, 16, .06), 0 1px 2px rgba(12, 20, 16, .04);
  --shadow-md: 0 6px 18px -8px rgba(12, 20, 16, .16), 0 2px 6px rgba(12, 20, 16, .05);
  --shadow-pop: 0 16px 40px -12px rgba(12, 20, 16, .22), 0 3px 10px rgba(12, 20, 16, .07);
  --shadow-pill: 0 18px 44px -12px rgba(12, 20, 16, .30), 0 4px 14px rgba(12, 20, 16, .10);

  --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, Menlo, monospace;

  --ease: cubic-bezier(.4, 0, .2, 1);
  --dur: .14s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--font-ui);
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text-main);
  background: #dfe6e2;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'kern' 1, 'liga' 1;
}
button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
svg { display: block; flex-shrink: 0; }
::selection { background: var(--brand-soft); }

/* 滚动条 */
.scrolly { overflow-y: auto; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: rgba(12,20,16,.18) transparent; }
.scrolly::-webkit-scrollbar { width: 8px; }
.scrolly::-webkit-scrollbar-track { background: transparent; }
.scrolly::-webkit-scrollbar-thumb { background: rgba(12,20,16,.16); border: 2px solid transparent; background-clip: padding-box; border-radius: 99px; }
.scrolly::-webkit-scrollbar-thumb:hover { background: rgba(12,20,16,.30); background-clip: padding-box; }

/* ============================================================
   舞台 + 真实窗口尺寸（默认 1040×670）
   ============================================================ */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden; }
.window {
  position: relative;
  width: 1040px; height: 670px;
  max-width: 100%; max-height: 100%;
  display: flex;
  background: var(--bg-app);
  border: 1px solid var(--border-base);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-pop);
}

/* ============================================================
   主导航栏（左侧竖排，通高）
   ============================================================ */
.rail {
  width: 68px; flex-shrink: 0;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border-base);
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 0;
  gap: 4px;
}
.rail-logo { width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 650; margin-bottom: 12px;
  box-shadow: var(--shadow-sm); }
.rail-btn { position: relative; width: 52px; height: 46px; border-radius: 10px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; color: var(--text-dim);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.rail-btn svg { width: 18px; height: 18px; }
.rail-btn span { font-size: 11px; letter-spacing: .01em; }
.rail-btn:hover { background: rgba(29,94,64,.07); color: var(--text-muted); }
.rail-btn.active { background: var(--bg-surface); color: var(--brand); box-shadow: var(--shadow-sm); }
.rail-btn.active::before { content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--brand); }
.rail-spacer { flex: 1; }

/* ============================================================
   右侧主体：44px 全宽标题栏 + 下层工作区
   ============================================================ */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.titlebar {
  height: 44px; flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 0 6px 0 16px;
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border-base);
  user-select: none;
  z-index: 45;
}
.tb-title { font-size: 14.5px; font-weight: 650; letter-spacing: -.015em; color: var(--text-main); }
.tb-badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 2px;
  font-size: 11.5px; color: var(--text-dim);
}
.tb-badge svg { width: 13px; height: 13px; }
.tb-badge.ok { color: var(--brand); }
.tb-spacer { flex: 1; }
.tb-btn { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.tb-btn svg { width: 16px; height: 16px; }
.tb-btn:hover { background: rgba(29,94,64,.08); color: var(--text-main); }
.tb-btn.danger:hover { background: var(--danger); color: #fff; }
.tb-sep { width: 1px; height: 20px; background: var(--border-base); margin: 0 5px; }

/* 工作区：抽屉严格从 44px 标题栏下方开始 */
.workspace { flex: 1; min-height: 0; display: flex; flex-direction: row; }
.stream-col { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-app); position: relative; }

/* ============================================================
   二级工具栏 32px 基线
   ============================================================ */
.subtoolbar {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 14px;
  background: var(--bg-app);
  border-bottom: 1px solid var(--border-card);
  position: relative;
  z-index: 40;
}
.search {
  height: 34px; width: 292px; min-width: 160px; flex-shrink: 1;
  display: flex; align-items: center; gap: 8px;
  padding: 0 9px 0 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: 9px;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }
.search > svg { width: 14px; height: 14px; color: var(--text-dim); }
.search input { flex: 1; min-width: 0; border: none; outline: none; background: none; height: 100%; font-size: 13px; }
.search input::placeholder { color: var(--text-dim); }
.search-count { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; padding-right: 2px; }
.search-clear { width: 18px; height: 18px; border-radius: 99px; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
.search-clear:hover { background: var(--border-card); color: var(--text-main); }
.search-clear svg { width: 11px; height: 11px; }

.tb-group { display: flex; align-items: center; gap: 2px; margin-left: 6px; }
.tool {
  height: 34px; min-width: 34px; padding: 0 9px; white-space: nowrap; flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid transparent; border-radius: 8px;
  color: var(--text-muted); font-size: 12.5px;
  transition: border-color var(--dur) var(--ease), color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.tool svg { width: 14px; height: 14px; }
.tool:hover { background: var(--bg-surface); color: var(--text-main); box-shadow: var(--shadow-xs); }
.tool.on { background: var(--brand-wash); border-color: transparent; color: var(--brand); font-weight: 600; box-shadow: none; }
.tool.icon { padding: 0; width: 34px; justify-content: center; }
.tool.dangerish:hover { color: var(--danger); background: var(--danger-bg); }
.spacer { flex: 1; }

/* 气泡面板 */
.pop {
  position: absolute; top: 48px; z-index: 50;
  min-width: 208px; padding: 12px;
  background: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: 12px;
  box-shadow: var(--shadow-pop);
}
.pop-label { font-size: 11px; font-weight: 650; letter-spacing: .05em; color: var(--text-dim); margin: 2px 2px 8px; }
.seg { display: flex; gap: 3px; padding: 3px; background: var(--bg-app); border: 1px solid var(--border-card); border-radius: 9px; }
.seg button { flex: 1; height: 30px; border-radius: 7px; font-size: 12.5px; color: var(--text-dim);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.seg button:hover { color: var(--text-main); }
.seg button.on { background: var(--bg-surface); color: var(--brand); font-weight: 600; box-shadow: var(--shadow-xs); }
.pop-row { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 8px; border-radius: 8px; width: 100%;
  font-size: 13px; color: var(--text-muted); }
.pop-row:hover { background: var(--bg-app); color: var(--text-main); }
.pop-row.on { background: var(--brand-wash); color: var(--brand); font-weight: 600; }
.pop-row .n { margin-left: auto; font-size: 11.5px; color: var(--text-dim); }
.pop-row.on .n { color: var(--brand); }
.pop-div { height: 1px; background: var(--border-card); margin: 11px -12px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 99px;
  font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim);
  background: var(--bg-app); border: 1px solid var(--border-card);
  transition: all var(--dur) var(--ease); }
.chip .n { font-size: 10.5px; opacity: .8; }
.chip:hover { border-color: var(--border-card-hover); color: var(--text-main); }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }

/* ============================================================
   快速想法输入槽
   ============================================================ */
.quickbar { flex-shrink: 0; display: flex; align-items: center; gap: 9px; padding: 14px 16px 10px; }
.quick {
  flex: 1; height: 38px; display: flex; align-items: center; gap: 9px;
  padding: 0 5px 0 12px;
  background: var(--bg-surface); border: 1px solid var(--border-card); border-radius: 10px;
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.quick:hover { border-color: var(--border-card-hover); box-shadow: 0 0 0 3px rgba(29,94,64,.05); }
.quick:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }
.quick svg { width: 14px; height: 14px; color: var(--text-dim); }
.quick input { flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: none; font-size: 13px; }
.quick input::placeholder { color: var(--text-dim); }
.publish {
  height: 38px; padding: 0 16px; border-radius: 10px;
  background: var(--brand); color: #fff; font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 7px;
  box-shadow: var(--shadow-sm);
  transition: background var(--dur) var(--ease);
}
.publish:hover { background: var(--brand-hover); }
.publish:active { background: var(--brand-hover); transform: translateY(.5px); }
.publish svg { width: 13px; height: 13px; }

/* ============================================================
   卡片流
   ============================================================ */
.stream { flex: 1; min-height: 0; padding: 6px 16px 104px; }
.stream-inner { max-width: 880px; margin: 0 auto; }
.glabel {
  font-size: 12px; font-weight: 600; color: var(--text-dim); letter-spacing: .01em;
  padding: 14px 2px 8px; display: flex; align-items: baseline; gap: 7px; user-select: none;
}
.glabel .n { font-weight: 500; opacity: .8; }
.glabel.top { color: var(--brand); }

.card {
  position: relative;
  display: flex; align-items: flex-start;
  background: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-xs);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.card:hover { border-color: var(--border-card-hover); box-shadow: var(--shadow-md); }
.card.picked { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }
.card.locked-card { background: #fcfdfc; }

.pick {
  width: 0; overflow: hidden; display: flex; align-items: flex-start; padding-top: 3px; opacity: 0;
  transition: width var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
body.batch .pick { width: 32px; opacity: 1; }
.cbx { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border-card-hover);
  background: var(--bg-surface); display: flex; align-items: center; justify-content: center; color: #fff;
  transition: all var(--dur) var(--ease); }
.cbx svg { width: 12px; height: 12px; opacity: 0; }
.cbx.on { background: var(--brand); border-color: var(--brand); }
.cbx.on svg { opacity: 1; }

.card-body { flex: 1; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; transition: padding-right var(--dur) var(--ease); }
.card:hover .card-head, .card:focus-within .card-head { padding-right: 214px; }
.dot { width: 5px; height: 5px; border-radius: 99px; background: var(--border-card-hover); flex-shrink: 0; }
.card-title { font-size: 14.5px; font-weight: 650; color: var(--text-main); letter-spacing: -.012em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pin-ico, .lock-ico { display: inline-flex; align-items: center; justify-content: center; color: var(--brand); flex-shrink: 0; }
.pin-ico svg { width: 12px; height: 12px; }
.lock-ico { color: var(--warn); }
.lock-ico svg { width: 12px; height: 12px; }
.fav-ico { color: #b8860b; display: inline-flex; }
.fav-ico svg { width: 12px; height: 12px; }
.time { margin-left: auto; font-size: 11.5px; color: var(--text-dim); white-space: nowrap; padding-left: 10px;
  transition: opacity var(--dur) var(--ease); }

.card-acts {
  display: flex; align-items: center; gap: 2px;
  position: absolute; right: 11px; top: 11px;
  padding: 3px; border-radius: 9px; background: var(--bg-surface);
  border: 1px solid var(--border-card);
  box-shadow: var(--shadow-sm);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur) var(--ease);
}
.card:hover .card-acts, .card:focus-within .card-acts { opacity: 1; pointer-events: auto; }
.card:hover .time, .card:focus-within .time { opacity: 0; }
.act { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); position: relative;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.act svg { width: 15px; height: 15px; }
.act:hover { background: var(--bg-app); color: var(--brand); }
.act.del:hover { background: var(--danger-bg); color: var(--danger); }
.act.on { color: var(--brand); }
.act.on.fav { color: #b8860b; }
.act::after {
  content: attr(data-tip); position: absolute; top: 32px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--bg-surface); background: var(--text-main); padding: 3px 7px; border-radius: 6px;
  white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s var(--ease); z-index: 5;
}
.act:hover::after { opacity: .94; }
body.batch .card-acts { display: none; }

.content { font-size: 13.5px; color: var(--text-muted); line-height: 23px; }
.content p { margin: 2px 0; }
.content h4 { font-size: 13.5px; font-weight: 650; color: var(--text-main); margin: 9px 0 3px; letter-spacing: -.008em; }
.content ul, .fs-content ul { list-style: none; margin: 3px 0; }
.content li, .fs-content li { display: flex; gap: 7px; align-items: baseline; }
.content li .mk, .fs-content li .mk { font-family: var(--font-mono); color: var(--text-dim); font-size: 11.5px; }
.content li.done, .fs-content li.done { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--border-card-hover); }
.role { display: inline-flex; align-items: center; height: 19px; padding: 0 7px; border-radius: 6px;
  font-family: var(--font-mono); font-size: 11px; color: var(--brand); background: var(--brand-wash);
  border: 1px solid var(--brand-soft); }
code.ic { font-family: var(--font-mono); font-size: 12px; background: var(--bg-app); border: 1px solid var(--border-card);
  border-radius: 5px; padding: 1px 5px; color: var(--text-main); }
pre.block {
  font-family: var(--font-mono); font-size: 12px; line-height: 1.66;
  background: #f6f9f7; border: 1px solid var(--border-card); border-radius: 8px;
  padding: 10px 12px; margin: 8px 0 2px; overflow-x: auto; color: var(--text-main); white-space: pre;
}
/* 整行截断：max-height 由 JS 按子元素行边界设定，绝不裁半行 */
.content.clamp { overflow: hidden; }
.unfold { display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; height: 24px; padding: 0 9px 0 0;
  font-size: 12px; font-weight: 600; color: var(--brand); border-radius: 6px; }
.unfold:hover { color: var(--brand-hover); text-decoration: underline; }
.unfold svg { width: 12px; height: 12px; transition: transform var(--dur) var(--ease); }
.unfold.up svg { transform: rotate(180deg); }
.unfold.hide { display: none; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); background: var(--bg-app);
  border: 1px solid var(--border-card); border-radius: 99px; padding: 2px 8px; }

/* 加密锁定卡 */
.lockcard { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; cursor: pointer; padding: 4px 0; }
.lock-disc { width: 34px; height: 34px; border-radius: 10px; background: var(--warn-bg); color: var(--warn);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.lock-disc svg { width: 16px; height: 16px; }
.lock-meta { min-width: 0; }
.lock-name { font-size: 14px; font-weight: 650; color: var(--text-main); letter-spacing: -.01em; }
.lock-hint { font-size: 12px; color: var(--warn); display: flex; align-items: baseline; gap: 9px; margin-top: 1px; }
.lock-hint .k { font-size: 11.5px; color: var(--text-dim); }

/* 就地编辑 */
.edit-wrap { flex: 1; min-width: 0; }
.edit-area {
  width: 100%; min-height: 108px; resize: vertical;
  font-family: var(--font-mono); font-size: 12px; line-height: 1.62; color: var(--text-main);
  background: #fcfdfc; border: 1px solid var(--border-card); border-radius: 8px; padding: 8px 10px; outline: none;
}
.edit-area:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }
.edit-tags { width: 100%; margin-top: 6px; height: 28px; font-family: var(--font-mono); font-size: 11.5px;
  background: var(--bg-surface); border: 1px solid var(--border-card); border-radius: 8px; padding: 0 10px; outline: none; }
.edit-tags:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }
.edit-foot { display: flex; align-items: center; gap: 7px; margin-top: 10px; }
.hint { font-size: 11.5px; color: var(--text-dim); margin-right: auto; line-height: 1.5; }

.btn { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--border-card); background: var(--bg-surface); color: var(--text-muted);
  transition: all var(--dur) var(--ease); }
.btn svg { width: 13px; height: 13px; }
.btn:hover { border-color: var(--border-card-hover); color: var(--text-main); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: #fff; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { background: #b91c1c; border-color: #b91c1c; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--bg-app); }

/* 空状态 */
.empty { text-align: center; padding: 54px 20px; color: var(--text-dim); }
.empty .box { width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 12px; background: var(--bg-surface);
  border: 1px solid var(--border-card); display: flex; align-items: center; justify-content: center; }
.empty .box svg { width: 20px; height: 20px; }
.empty b { display: block; font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 3px; }
.empty small { font-size: 12px; }

/* ============================================================
   右侧抽屉
   ============================================================ */
.drawer {
  width: 248px; flex-shrink: 0;
  background: var(--bg-drawer);
  border-left: 1px solid var(--border-card);
  display: flex; flex-direction: column;
  min-height: 0;
}
.drawer.hidden { display: none; }
.drawer-scroll { flex: 1; min-height: 0; padding: 14px 12px 18px; }
.sec-h { display: flex; align-items: baseline; gap: 6px; font-size: 11px; font-weight: 650; letter-spacing: .06em;
  color: var(--text-dim); padding: 6px 8px 9px; user-select: none; }
.sec-h .n { font-weight: 500; letter-spacing: 0; opacity: .85; }
.sec + .sec { margin-top: 18px; }
.vrow { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border-radius: 9px;
  font-size: 13px; color: var(--text-muted); transition: all var(--dur) var(--ease); }
.vrow svg { width: 15px; height: 15px; color: var(--text-dim); }
.vrow .n { margin-left: auto; font-size: 11.5px; color: var(--text-dim); }
.vrow:hover { background: var(--bg-surface); color: var(--text-main); }
.vrow.on { background: var(--brand-wash); color: var(--brand); font-weight: 600; }
.vrow.on svg { color: var(--brand); }
.vrow.on .n { color: var(--brand); }
.trow { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 10px; border-radius: 9px;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
.trow .n { margin-left: auto; font-family: var(--font-ui); font-size: 11.5px; color: var(--text-dim); }
.trow:hover { background: var(--bg-surface); color: var(--text-main); }
.trow.on { background: var(--brand-wash); color: var(--brand); }
.drawer-foot { flex-shrink: 0; border-top: 1px solid var(--border-card); padding: 11px 14px; font-size: 11.5px;
  color: var(--text-dim); display: flex; align-items: center; gap: 7px; line-height: 1.5; }
.drawer-foot svg { width: 13px; height: 13px; flex-shrink: 0; }

/* ============================================================
   悬浮批量操作栏
   ============================================================ */
.batchbar {
  position: absolute; left: 50%; bottom: 22px; z-index: 42;
  transform: translate(-50%, 104px);
  display: flex; align-items: center; gap: 2px;
  height: 50px; padding: 0 8px 0 18px;
  max-width: calc(100% - 40px);
  background: var(--bg-surface);
  border: 1px solid var(--border-card);
  border-radius: 99px;
  box-shadow: 0 26px 60px -18px rgba(12, 20, 16, .38), 0 6px 18px rgba(12, 20, 16, .14);
  transition: transform .18s var(--ease);
  pointer-events: none;
}
.batchbar.show { transform: translate(-50%, 0); pointer-events: auto; }
body.fs-open .batchbar { display: none; }
.bb-count { font-size: 13px; color: var(--text-muted); white-space: nowrap; margin-right: 4px; }
.bb-count b { font-family: var(--font-mono); color: var(--brand); font-weight: 650; }
.bb-btn { height: 34px; padding: 0 9px; border-radius: 99px; font-size: 12.5px; color: var(--text-muted);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease); }
.bb-btn svg { width: 13px; height: 13px; }
.bb-btn:hover { background: var(--bg-app); color: var(--text-main); }
.bb-btn.danger:hover { background: var(--danger-bg); color: var(--danger); }
.bb-div { width: 1px; height: 20px; background: var(--border-card); margin: 0 4px; }
.bb-done { background: var(--brand); color: #fff; padding: 0 16px; font-weight: 500; }
.bb-done:hover { background: var(--brand-hover); color: #fff; }

/* ============================================================
   模态
   ============================================================ */
.layer { position: absolute; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center;
  background: var(--overlay); backdrop-filter: blur(2px); }
.layer.show { display: flex; }
.modal { width: 404px; background: var(--bg-surface); border: 1px solid var(--border-card); border-radius: 14px;
  box-shadow: var(--shadow-pop); padding: 22px; }
.modal.shake { animation: shake .28s var(--ease); }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
.modal-h { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.modal-h .disc { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  background: var(--warn-bg); color: var(--warn); }
.modal-h .disc svg { width: 17px; height: 17px; }
.modal-h .disc.danger { background: var(--danger-bg); color: var(--danger); }
.modal-h h3 { font-size: 15px; font-weight: 650; letter-spacing: -.014em; }
.modal-p { font-size: 12.5px; line-height: 1.6; color: var(--text-dim); margin: 0 0 16px 44px; }
.field { height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 11px;
  background: var(--bg-surface); border: 1px solid var(--border-card); border-radius: 9px;
  transition: all var(--dur) var(--ease); }
.field:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-ring); }
.field.err { border-color: #f0c9c9; background: #fffafa; }
.field svg { width: 14px; height: 14px; color: var(--text-dim); }
.field input { flex: 1; min-width: 0; border: none; outline: none; font-family: var(--font-mono); font-size: 13.5px; letter-spacing: .1em; }
.errmsg { font-size: 12px; color: var(--warn); margin: 8px 2px 0; min-height: 18px; }
.optline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); margin: 8px 0 16px; cursor: pointer; }
.optline input { accent-color: var(--brand); width: 14px; height: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; }
.modal-foot .btn { height: 32px; }
.demo-hint { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-card);
  font-size: 11.5px; color: var(--text-dim); font-family: var(--font-mono); }

/* ============================================================
   全屏阅读
   ============================================================ */
.fs { position: absolute; inset: 0; z-index: 60; display: none; flex-direction: column; background: var(--bg-app); }
.fs.show { display: flex; }
.fs-head { height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 16px;
  background: var(--bg-sidebar); border-bottom: 1px solid var(--border-base); }
.pill { height: 30px; padding: 0 12px; border-radius: 99px; display: inline-flex; align-items: center; gap: 7px;
  background: var(--bg-surface); border: 1px solid var(--border-card); font-size: 12.5px; color: var(--text-muted); }
.pill svg { width: 13px; height: 13px; }
.pill kbd { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); background: var(--bg-app);
  border: 1px solid var(--border-card); border-radius: 4px; padding: 1px 5px; }
.pill:hover { border-color: var(--border-card-hover); color: var(--text-main); }
.fs-mode { margin-left: auto; font-size: 12px; color: var(--text-dim); display: inline-flex; align-items: center; gap: 6px; }
.fs-mode svg { width: 13px; height: 13px; }
.fs-body { flex: 1; min-height: 0; padding: 40px 32px 16px; }
.fs-doc { width: 800px; max-width: 100%; margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-card);
  border-radius: 14px; padding: 40px 48px 44px; box-shadow: var(--shadow-md); }
.fs-meta { font-size: 11.5px; color: var(--text-dim); display: flex; align-items: center; gap: 9px; }
.fs-meta .sep { opacity: .5; }
.fs-title { font-size: 24px; font-weight: 650; letter-spacing: -.022em; line-height: 32px; margin: 12px 0 6px; color: var(--text-main); }
.fs-rule { height: 1px; background: var(--border-card); margin: 20px 0 24px; }
.fs-content { font-size: 14.5px; line-height: 27px; color: var(--text-muted); }
.fs-content h4 { font-size: 15.5px; margin: 20px 0 6px; }
.fs-content p { margin: 7px 0; }
.fs-content li { margin: 7px 0; }
.fs-content pre.block { font-size: 13px; padding: 14px 16px; margin: 12px 0 4px; }
.fs-edit { width: 100%; min-height: 340px; font-size: 13.5px; }
.fs-foot { flex-shrink: 0; height: 60px; display: flex; align-items: center; gap: 7px; padding: 0 16px;
  background: var(--bg-sidebar); border-top: 1px solid var(--border-base); }
.fs-foot .btn { height: 32px; padding: 0 13px; }

/* 窄窗口：抽屉让位给卡片流（≥900px 才常驻三段） */
@media (max-width: 900px) {
  .drawer { display: none; }
}

/* toast */
/* toast：底部居中；批量条/全屏底栏在场时上移让位 */
.toast { position: absolute; left: 50%; bottom: 20px; transform: translate(-50%, 12px); z-index: 95;
  display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 99px;
  background: var(--text-main); color: var(--bg-surface); font-size: 12px; box-shadow: var(--shadow-md);
  opacity: 0; pointer-events: none; transition: opacity .15s var(--ease), transform .15s var(--ease); }
.toast.show { opacity: .96; transform: translate(-50%, 0); }
.toast svg { width: 12px; height: 12px; }
body.batch .toast { bottom: 88px; }
body.fs-open .toast { bottom: 74px; }
</style>
</head>
<body>
<div class="stage">
  <div class="window" id="win">

    <!-- 主导航栏 -->
    <nav class="rail">
      <div class="rail-logo">D</div>
      <button class="rail-btn active" title="小记"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M14 4v6h6"/></svg><span>小记</span></button>
      <button class="rail-btn" title="条目"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" width="16" height="16"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r="1.3"/><circle cx="5" cy="12" r="1.3"/><circle cx="5" cy="18" r="1.3"/></svg><span>条目</span></button>
      <button class="rail-btn" title="文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></svg><span>文件</span></button>
      <button class="rail-btn" title="传输"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12 4v10M8 8l4-4 4 4"/><path d="M4 16v3h16v-3"/></svg><span>传输</span></button>
      <button class="rail-btn" title="验证码"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" width="16" height="16"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>验证</span></button>
      <div class="rail-spacer"></div>
    </nav>

    <div class="main">
      <!-- 44px 全局标题栏：从主导航右侧一直贯通到窗口最右 -->
      <header class="titlebar">
        <div class="tb-title">小记</div>
        <div class="tb-badge ok" id="syncBadge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17.5 10.5 3.75 3.75 0 0 1 17 18H7Z"/><path d="M12 14v-4M10 12l2-2 2 2"/></svg>
          已同步
        </div>
        <div class="tb-spacer"></div>
        <button class="tb-btn" title="设置" id="btnSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47V21a2 2 0 1 1-4 0v-.09A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.6 1.6 0 0 0 4.6 15a1.6 1.6 0 0 0-1.47-.97H3a2 2 0 1 1 0-4h.09A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.6h.09A1.6 1.6 0 0 0 10 3.13V3a2 2 0 1 1 4 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.6 1.6 0 0 0 19.4 9v.09a1.6 1.6 0 0 0 1.47.97H21a2 2 0 1 1 0 4h-.09a1.6 1.6 0 0 0-1.51.94Z"/></svg></button>
        <button class="tb-btn" title="锁屏" id="btnLockScreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
        <div class="tb-sep"></div>
        <button class="tb-btn" title="最小化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="tb-btn" title="最大化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
        <button class="tb-btn danger" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </header>

      <!-- 下层工作区 -->
      <div class="workspace">
        <section class="stream-col">
          <div class="subtoolbar">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
              <input id="q" type="text" placeholder="搜索小记…" autocomplete="off" />
              <span class="search-count" id="qcount">5/5 条</span>
              <button class="search-clear" id="qclear" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="tb-group">
              <button class="tool" id="btnSort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M4 7l3-3 3 3M17 20V4M14 17l3 3 3-3"/></svg><span id="sortLabel">最新</span></button>
              <button class="tool" id="btnFilter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8L4 5Z"/></svg>筛选</button>
              <button class="tool icon" id="btnBatch" data-tip="批量选择"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/></svg></button>
              <button class="tool icon" id="btnLockAll" data-tip="一键安全锁定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
            </div>
            <div class="spacer"></div>
            <button class="tool icon" id="btnDrawer" data-tip="收起右侧栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>

            <div class="pop" id="popSort" style="display:none; left: 292px;">
              <div class="pop-label">排序方式</div>

                <button data-sort="newest" class="on">最新</button>
                <button data-sort="oldest">最早</button>
                <button data-sort="updated">最近更新</button>
              </div>
            </div>

            <div class="pop" id="popFilter" style="display:none; left: 362px;">
              <div class="pop-label">视图类型</div>
              <div id="popViews"></div>
              <div class="pop-div"></div>
              <div class="pop-label">标签</div>
              <div class="chips" id="popTags"></div>
            </div>
          </div>

          <div class="quickbar">
            <div class="quick">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>
              <input id="quick" type="text" placeholder="此刻的想法… 用 #标签 归类" autocomplete="off" />
            </div>
            <button class="publish" id="btnPublish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>发布</button>
          </div>

          <div class="stream scrolly" id="stream"><div class="stream-inner" id="streamInner"></div></div>

          <!-- 悬浮批量操作栏：跟随卡片列居中，抽屉收放不跑位 -->
          <div class="batchbar" id="batchbar">
            <div class="bb-count">已选 <b id="bbN">0</b> 条</div>
            <button class="bb-btn" id="bbAll">全选</button>
            <button class="bb-btn" id="bbNone">取消全选</button>
            <div class="bb-div"></div>

            <button class="bb-btn" data-batch="unfav">取消收藏</button>
            <div class="bb-div"></div>

            <div class="bb-div"></div>
            <button class="bb-btn bb-done" id="bbDone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>完成</button>
          </div>
        </section>

        <!-- 右侧抽屉：顶部严格落在 44px 标题栏之下 -->
        <aside class="drawer" id="drawer">
          <div class="drawer-scroll scrolly">
            <div class="sec">
              <div class="sec-h">视图</div>
              <div id="drawerViews"></div>
            </div>
            <div class="sec">
              <div class="sec-h">标签 <span class="n" id="tagTotal">· 1</span></div>
              <div id="drawerTags"></div>
            </div>
          </div>
          <div class="drawer-foot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 16h.01"/></svg>
            <span id="drawerSummary">共 5 条小记</span>
          </div>
        </aside>
      </div>

      <!-- 全屏阅读 -->
      <div class="fs" id="fs">
        <div class="fs-head">

          <div class="fs-mode" id="fsMode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>只读浏览</div>
        </div>
        <div class="fs-body scrolly" id="fsBody"></div>
        <div class="fs-foot" id="fsFoot"></div>
      </div>

      <!-- 模态层 -->
      <div class="layer" id="layer"><div id="modalHost"></div></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   图标
   ============================================================ */
const I = {
  expand: '<path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/>',
  edit: '<path d="M4 20h4L20 8l-4-4L4 16v4Z"/>',
  pin: '<path d="M9 4h6l-1 6 3 3v2h-4v5h-2v-5H7v-2l3-3-1-6Z"/>',

const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
function groupOf(ts) {
  const diff = Math.round((startOfDay(Date.now()) - startOfDay(ts)) / D);
  if (diff <= 0) return '今天';
  if (diff === 1) return '昨天';
  if (diff < 7) return '本周';
  return '更早';
}
function relTime(ts) {
  const m = Math.round((Date.now() - ts) / 60e3);
  if (m < 1) return '刚刚';
  if (m < 60) return `${m} 分钟前`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} 小时前`;
  const d = new Date(ts), p = new Date();
  return `${d.getMonth() + 1}月${d.getDate()}日${p.getFullYear() !== d.getFullYear() ? ' ' + d.getFullYear() : ''}`;
}
const fullDate = ts => {
  const d = new Date(ts), w = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日 · 周${w} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code class="ic">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(（])(#[\w\-\u4e00-\u9fa5]+)/g, '$1<span class="tag" style="display:inline-block">$2</span>')
    .replace(/(^|\s)(@[A-Za-z][\w-]*)/g, '$1<span class="role">$2</span>');
}
function renderMd(text) {
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let code = null, list = false;
  const closeList = () => { if (list) { out.push('</ul>'); list = false; } };
  for (const raw of lines) {
    if (raw.trimStart().startsWith('```')) {
      if (code === null) { closeList(); code = []; }
      else { out.push('<pre class="block">' + esc(code.join('\n')) + '</pre>'); code = null; }
      continue;
    }
    if (code !== null) { code.push(raw); continue; }
    const line = raw.trimEnd();
    if (/^[-*] \[[ xX]\]\s?/.test(line.trim())) {
      if (!list) { out.push('<ul>'); list = true; }
      const done = /[xX]\]/.test(line.slice(0, 8));
      const body = line.trim().replace(/^[-*] \[[ xX]\]\s?/, '');
      out.push(`<li class="${done ? 'done' : ''}"><span class="mk">${done ? '☑' : '☐'}</span><span>${inline(body)}</span></li>`);
      continue;
    }
    closeList();
    if (/^>\s?/.test(line.trim())) { out.push(`<p style="border-left:2px solid var(--border-card);padding-left:10px;color:var(--text-dim)">${inline(line.trim().replace(/^>\s?/, ''))}</p>`); continue; }
    if (/^#{1,4}\s+/.test(line.trim())) { out.push(`<h4>${inline(line.trim().replace(/^#{1,4}\s+/, ''))}</h4>`); continue; }
    if (!line.trim()) continue;
    out.push(`<p>${inline(line)}</p>`);
  }
  if (code !== null) out.push('<pre class="block">' + esc(code.join('\n')) + '</pre>');
  closeList();
  return out.join('');
}
const plain = t => String(t).replace(/```[\s\S]*?```/g, m => m.replace(/```/g, '')).replace(/^#{1,4}\s+/gm, '').replace(/[-*] \[[ xX]\]\s?/g, '').replace(/[*`>]/g, '').trim();

/* 卡片正文按“整行”截断：切在子元素或行框边界上，绝不出现半行 */
const CLAMP_LINES = 6;
const CLAMP_TOL = 8;
function fitClamps() {
  $$('#streamInner .content').forEach(el => {
    const id = el.dataset.cid;
    const btn = el.parentElement.querySelector('.unfold');
    const open = S.expanded.has(id);
    if (open) {
      el.classList.remove('clamp'); el.style.maxHeight = '';
      if (btn) { btn.classList.remove('hide'); btn.querySelector('span').textContent = '收起'; btn.classList.add('up'); }
      return;
    }
    if (btn) btn.classList.remove('up');
    el.classList.add('clamp');
    el.style.maxHeight = '';
    const kids = [...el.children];
    const lh = parseFloat(getComputedStyle(el).lineHeight) || 24;
    const budget = CLAMP_LINES * lh;
    let cut = 0;
    for (const k of kids) {
      const top = k.offsetTop - el.offsetTop;
      const bottom = top + k.offsetHeight;
      if (bottom <= budget + 1) cut = bottom; else break;
    }
    if (cut === 0 && kids.length) {
      const top = kids[0].offsetTop - el.offsetTop;
      cut = top + Math.max(1, Math.floor((budget - top) / lh)) * lh;
    }
    const truncated = el.scrollHeight > cut + CLAMP_TOL;
    if (truncated) {
      el.style.maxHeight = Math.round(cut) + 'px';
      if (btn) { btn.classList.remove('hide'); btn.querySelector('span').textContent = '展开全文'; }
    } else {
      el.classList.remove('clamp'); el.style.maxHeight = '';
      if (btn) btn.classList.add('hide');
    }
  });
}

function tryUnlock() {
  const val = $('#pwd').value;
  if (val !== PASSCODE) {
    $('#pwdErr').textContent = `口令不正确（第 ${(+$('#pwdErr').dataset.n || 0) + 1} 次）`;
    $('#pwdErr').dataset.n = (+$('#pwdErr').dataset.n || 0) + 1;

    $('#pwd').select();

  const keep = $('#keep').checked;
  const targets = S.modal.targets;
  notes.forEach(n => { if (targets.includes(n.id)) n.locked = false; });
  if (keep) S.sessionUnlocked = true;
  closeModal();
  if (!keep) { const ids = new Set(targets); setTimeout(() => { notes.forEach(n => { if (ids.has(n.id)) n.locked = true; }); render(); }, 60000); }
  render();
  toast(keep ? '已解锁 · 本次会话保持' : '已解锁');
}

    <div class="modal">
      <div class="modal-h"><div class="disc danger">${ic('trash', 15)}</div><h3>删除${one ? '小记' : ` ${ids.length} 条小记`}</h3></div>
      <div class="modal-p">${one ? `「${esc(n?.title || '未命名小记')}」将被永久删除，本地与备份包中的记录都会移除。` : '所选小记将被永久删除，此操作不可撤销。'}</div>
      <div class="modal-foot">
        <button class="btn ghost" data-mact="cancel">取消</button>
        <button class="btn danger" data-mact="del">删除</button>
      </div>
    </div>`;
  $('#layer').classList.add('show');
}

/* ============================================================
   全屏阅读
   ============================================================ */
function openFs(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  if (n.locked && !S.sessionUnlocked) { openUnlock([id]); return; }
  S.fullscreen = id; S.fsEditing = false;
  document.body.classList.add('fs-open');
  $('#fs').classList.add('show');
  renderFs();
  $('#fsBody').scrollTop = 0;
}
function closeFs() { S.fullscreen = null; S.fsEditing = false; document.body.classList.remove('fs-open'); $('#fs').classList.remove('show'); }
function renderFs() {
  const n = notes.find(x => x.id === S.fullscreen);
  if (!n) { closeFs(); return; }
  $('#fsMode').innerHTML = S.fsEditing
    ? `${ic('edit', 12)}编辑中`
    : `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>只读浏览`;
  $('#fsBody').innerHTML = `
    <article class="fs-doc">
      <div class="fs-meta"><span>${fullDate(n.createdAt)}</span><span class="sep">·</span><span>${words(plain(n.content))} 词 / ${n.content.length} 字</span><span class="sep">·</span><span>${relTime(n.updatedAt)}</span></div>
      ${S.fsEditing
        ? `<textarea class="edit-area fs-edit" id="fsDraft">${esc(n.content)}</textarea>`
        : `<h1 class="fs-title">${esc(n.title || '未命名小记')}</h1><div class="fs-rule"></div><div class="fs-content">${renderMd(n.content)}</div>
           ${n.tags.length ? `<div class="tags" style="margin-top:22px">${n.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : ''}`}
    </article>`;
  $('#fsFoot').innerHTML = `
    <button class="btn ${n.pinned ? 'primary' : ''}" data-fact="pin">${ic('pin')}<span>${n.pinned ? '已置顶' : '置顶'}</span></button>
    <button class="btn ${n.fav ? 'primary' : ''}" data-fact="fav">${ic('fav')}<span>${n.fav ? '已收藏' : '收藏'}</span></button>
    <div class="spacer"></div>
    <button class="btn" data-fact="del" style="color:var(--danger)">${ic('trash')}删除</button>
    ${S.fsEditing
      ? `<button class="btn" data-fact="cancel">取消</button><button class="btn primary" data-fact="save">${ic('save')}保存</button>`
      : `<button class="btn primary" data-fact="edit">${ic('edit')}编辑</button>`}`;
}

/* ============================================================
   交互：气泡
   ============================================================ */
function togglePop(which) {
  S.pop = S.pop === which ? null : which;
  $('#popSort').style.display = S.pop === 'sort' ? 'block' : 'none';
  $('#popFilter').style.display = S.pop === 'filter' ? 'block' : 'none';
}
$('#btnSort').addEventListener('click', e => { e.stopPropagation(); togglePop('sort'); });
$('#btnFilter').addEventListener('click', e => { e.stopPropagation(); togglePop('filter'); });
$('#segSort').addEventListener('click', e => {
  const b = e.target.closest('[data-sort]'); if (!b) return;
  S.sort = b.dataset.sort;
  $$('#segSort button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.addEventListener('click', e => {
  if (!e.target.closest('.pop') && !e.target.closest('#btnSort') && !e.target.closest('#btnFilter')) {
    S.pop = null; $('#popSort').style.display = 'none'; $('#popFilter').style.display = 'none';
  }
});

/* ============================================================
   交互：搜索 / 快速输入
   ============================================================ */
$('#q').addEventListener('input', e => { S.q = e.target.value; render(); });
$('#qclear').addEventListener('click', () => { S.q = ''; $('#q').value = ''; render(); $('#q').focus(); });
function publish() {
  const raw = $('#quick').value.trim();
  if (!raw) { $('#quick').focus(); return; }
  const tags = [];
  const body = raw.replace(/#([\w\u4e00-\u9fa5-]+)/g, (_, t) => { tags.push(t); return ''; }).replace(/\s{2,}/g, ' ').trim();
  const title = body.split('\n')[0].slice(0, 26) || '未命名小记';
  notes.unshift({ id: 'n' + Date.now(), title, content: body, tags: [...new Set(tags)], locked: false, pinned: false, fav: false, createdAt: Date.now(), updatedAt: Date.now() });
  $('#quick').value = '';
  S.q = ''; $('#q').value = '';
  render();
  toast('已发布 1 条小记');
}
$('#btnPublish').addEventListener('click', publish);
$('#quick').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); publish(); } });

/* ============================================================
   交互：工具栏
   ============================================================ */
$('#btnBatch').addEventListener('click', () => {
  S.batch = !S.batch;
  S.picked.clear();
  render();
  toast(S.batch ? '批量选择已开启' : '已退出批量选择');
});
$('#btnLockAll').addEventListener('click', () => {
  const open = notes.filter(n => !n.locked).length;
  if (!open) { toast('所有小记均已锁定'); return; }
  S.sessionUnlocked = false;
  notes.forEach(n => n.locked = true);
  S.editing = null; S.picked.clear();
  if (S.fullscreen) closeFs();
  render();
  toast(`已锁定 ${open} 条小记`);
});
$('#btnDrawer').addEventListener('click', () => { S.drawer = !S.drawer; renderRail(); requestAnimationFrame(fitClamps); });
$('#btnSettings').addEventListener('click', () => toast('设置弹窗（原型未接入）'));
$('#btnLockScreen').addEventListener('click', () => { $('#btnLockAll').click(); });

/* 抽屉与气泡内的视图/标签 */
['#drawerViews', '#popViews'].forEach(sel => $(sel).addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  e.stopPropagation();
  S.view = b.dataset.view; render();
}));
['#drawerTags', '#popTags'].forEach(sel => $(sel).addEventListener('click', e => {
  const b = e.target.closest('[data-tag]'); if (!b) return;
  e.stopPropagation();
  const t = b.dataset.tag;
  S.tags.has(t) ? S.tags.delete(t) : S.tags.add(t);
  render();
}));

/* ============================================================
   交互：批量栏
   ============================================================ */
$('#bbAll').addEventListener('click', () => { S.picked = new Set(filtered().map(n => n.id)); render(); });
$('#bbNone').addEventListener('click', () => { S.picked.clear(); render(); });
$('#bbDone').addEventListener('click', () => { S.batch = false; S.picked.clear(); render(); toast('已退出批量选择'); });
$$('[data-batch]').forEach(b => b.addEventListener('click', () => {
  const ids = [...S.picked];
  if (!ids.length) { toast('请先选择小记'); return; }
  switch (b.dataset.batch) {
    case 'pin': notes.forEach(n => { if (ids.includes(n.id)) { n.pinned = true; touched(n); } }); toast(`已置顶 ${ids.length} 条`); break;
    case 'unpin': notes.forEach(n => { if (ids.includes(n.id)) { n.pinned = false; touched(n); } }); toast(`已取消置顶 ${ids.length} 条`); break;
    case 'fav': notes.forEach(n => { if (ids.includes(n.id)) { n.fav = true; touched(n); } }); toast(`已收藏 ${ids.length} 条`); break;
    case 'unfav': notes.forEach(n => { if (ids.includes(n.id)) { n.fav = false; touched(n); } }); toast(`已取消收藏 ${ids.length} 条`); break;
    case 'del': confirmDelete(ids); return;
  }
  render();
}));

/* ============================================================
   交互：卡片动作（事件代理）
   ============================================================ */
$('#streamInner').addEventListener('input', e => {
  if (e.target.id === 'draftContent') S.draft.content = e.target.value;
  if (e.target.id === 'draftTags') S.draft.tags = e.target.value;
});
$('#streamInner').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const id = card.dataset.id;
  const n = notes.find(x => x.id === id); if (!n) return;
  const actEl = e.target.closest('[data-act]'); if (!actEl) return;
  const a = actEl.dataset.act;

  if (a === 'unlock') { openUnlock([id]); return; }
  if (a === 'fold') { S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); render(); return; }
  if (a === 'pick') {
    S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id);
    render(); return;
  }
  if (a === 'del') { confirmDelete([id]); return; }
  if (a === 'expand') { openFs(id); return; }
  if (a === 'pin') { n.pinned = !n.pinned; touched(n); render(); toast(n.pinned ? '已置顶' : '已取消置顶'); return; }
  if (a === 'fav') { n.fav = !n.fav; touched(n); render(); toast(n.fav ? '已收藏' : '已取消收藏'); return; }
  if (a === 'copy') { copyText(plain(n.content)); return; }
  if (a === 'lock') {
    n.locked = true; S.sessionUnlocked = false; S.picked.delete(id);
    render(); toast('已加密锁定'); return;
  }
  if (a === 'edit') {
    S.editing = id; S.draft = { content: n.content, tags: n.tags.join(', ') };
    render(); setTimeout(() => $('#draftContent')?.focus(), 20); return;
  }
  if (a === 'cancel') { S.editing = null; S.draft = null; render(); return; }
  if (a === 'save') {
    n.content = S.draft.content;
    n.tags = [...new Set(S.draft.tags.split(/[,，\s]+/).map(s => s.replace(/^#/, '')).filter(Boolean))];
    n.title = plain(n.content).split('\n')[0].slice(0, 26) || '未命名小记';
    touched(n); S.editing = null; S.draft = null; render(); toast('已保存'); return;
  }
});

function copyText(t) {
  const done = () => toast('正文已复制到剪贴板');
  if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(t).then(done, fallback); }
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch { toast('复制失败'); }
    document.body.removeChild(ta);
  }
}

/* ============================================================
   交互：模态层 / 全屏
   ============================================================ */
$('#layer').addEventListener('click', e => {
  if (e.target === $('#layer') && !e.target.closest('.modal')) { closeModal(); return; }
  const b = e.target.closest('[data-mact]'); if (!b) return;
  const a = b.dataset.mact;
  if (a === 'cancel') closeModal();
  if (a === 'submit') tryUnlock();
  if (a === 'del') {
    const ids = S.modal.ids;
    ids.forEach(id => { const i = notes.findIndex(n => n.id === id); if (i > -1) notes.splice(i, 1); });
    ids.forEach(id => S.picked.delete(id));
    closeModal();
    render(); toast(`已删除 ${ids.length} 条小记`);
  }
});
$('#fsExit').addEventListener('click', closeFs);
$('#fsFoot').addEventListener('click', e => {
  const b = e.target.closest('[data-fact]'); if (!b) return;
  const n = notes.find(x => x.id === S.fullscreen); if (!n) return;
  switch (b.dataset.fact) {
    case 'pin': n.pinned = !n.pinned; touched(n); renderFs(); renderRail(); toast(n.pinned ? '已置顶' : '已取消置顶'); break;
    case 'fav': n.fav = !n.fav; touched(n); renderFs(); renderRail(); toast(n.fav ? '已收藏' : '已取消收藏'); break;
    case 'edit': S.fsEditing = true; renderFs(); setTimeout(() => $('#fsDraft')?.focus(), 20); break;
    case 'cancel': S.fsEditing = false; renderFs(); break;
    case 'save':
      n.content = $('#fsDraft').value;
      n.title = plain(n.content).split('\n')[0].slice(0, 26) || '未命名小记';
      touched(n); S.fsEditing = false; render(); toast('已保存'); break;
    case 'del': confirmDelete([n.id]); break;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#layer').classList.contains('show')) { closeModal(); return; }
    if (S.pop) { S.pop = null; $('#popSort').style.display = 'none'; $('#popFilter').style.display = 'none'; return; }
    if ($('#fs').classList.contains('show')) { closeFs(); return; }
    if (S.batch) { S.batch = false; S.picked.clear(); render(); return; }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); S.drawer = !S.drawer; renderRail(); fitClamps(); }
});

window.addEventListener('resize', fitClamps);

render();
</script>
</body>
</html>
