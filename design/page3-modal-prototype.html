<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desko · 新增/编辑条目弹窗原型 (Page 3)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-app: #f4f7f5;
    --bg-sidebar: #ebf0ed;
    --bg-surface: #ffffff;
    --bg-subtle: #f8faf9;
    --border-base: #dce3df;
    --border-card: #e2e8e4;
    --text-main: #0f1713;
    --text-muted: #4a5c52;
    --text-dim: #7d9185;
    --brand: #216747;
    --brand-hover: #195237;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    background: var(--bg-app);
    color: var(--text-main);
  }
  .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }

  /* ---------- 输入框盒模型：30px / 6px 圆角 / 纯白 / 1px 青瓷细边 ---------- */
  .field-input {
    width: 100%; height: 32px;
    padding: 0 10px;
    font-size: 12.5px; line-height: 1;
    color: var(--text-main);
    background: var(--bg-surface);
    border: 1px solid var(--border-base);
    border-radius: 6px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field-input::placeholder { color: var(--text-dim); }
  textarea.field-input { height: 52px; padding: 7px 10px; line-height: 17px; resize: none; }
  .field-input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px rgba(33, 103, 71, 0.08);
  }
  .field-input.invalid { border-color: #b3372f; }
  @keyframes field-glow {
    0% { box-shadow: 0 0 0 0 rgba(179, 55, 47, .35); }
    70% { box-shadow: 0 0 0 4px rgba(179, 55, 47, .12); }
    100% { box-shadow: 0 0 0 5px rgba(179, 55, 47, 0); }
  }
  .field-input.invalid.pulse { animation: field-glow .5s ease-out 2; }

  .field-label {
    display: block;
    font-size: 12px; font-weight: 500; line-height: 14px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .req { color: #b3372f; }

  /* ---------- 子路径槽位 ---------- */
  .path-viewport {
    height: 80px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: transparent transparent;
  }
  .path-viewport:hover { scrollbar-color: var(--text-dim) transparent; }
  .path-viewport::-webkit-scrollbar { width: 3px; }
  .path-viewport::-webkit-scrollbar-track { background: transparent; }
  .path-viewport::-webkit-scrollbar-thumb { background: transparent; border-radius: 2px; }
  .path-viewport:hover::-webkit-scrollbar-thumb { background: var(--text-dim); }

  .path-row { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 5px 0 7px; border-radius: 4px; }
  .path-row:hover { background: rgba(33, 103, 71, 0.05); }
  .path-chip {
    flex-shrink: 0; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    height: 16px; line-height: 16px; padding: 0 6px; border-radius: 8px;
    font-size: 10.5px; font-weight: 500;
    color: var(--brand); background: rgba(33, 103, 71, 0.08);
  }
  .path-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--text-main); }
  .path-del {
    flex-shrink: 0; width: 18px; height: 18px; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 4px; background: transparent; cursor: pointer;
    color: #b3372f; font-size: 10px;
    opacity: 0; transition: opacity .12s ease, background .12s ease;
  }
  .path-row:hover .path-del { opacity: 1; }
  .path-del:hover { background: rgba(179, 55, 47, 0.08); }

  /* ---------- 按钮 ---------- */
  .btn-ghost {
    height: 28px; padding: 0 10px; border: none; background: transparent; cursor: pointer;
    font-size: 12.5px; color: var(--text-muted); border-radius: 6px; font-family: inherit;
    transition: background .12s ease, color .12s ease;
  }
  .btn-ghost:hover { background: var(--bg-sidebar); color: var(--text-main); }
  .btn-primary {
    height: 28px; padding: 0 14px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 12.5px; font-weight: 500; color: #f2f7f4; font-family: inherit;
    background: var(--brand);
    box-shadow: 0 0 0 1px rgba(25, 82, 55, 1), 0 1px 2px rgba(15, 23, 19, 0.18);
    transition: background .12s ease;
  }
  .btn-primary:hover { background: var(--brand-hover); }
  .btn-add {
    flex-shrink: 0; height: 28px; padding: 0 11px; border-radius: 5px; cursor: pointer;
    font-size: 12px; font-family: inherit; color: var(--text-muted);
    background: var(--bg-surface); border: 1px solid var(--border-base);
    transition: color .12s ease, border-color .12s ease;
  }
  .btn-add:hover { color: var(--brand); border-color: var(--brand); }

  .kbd {
    display: inline-block; padding: 1px 4px; border-radius: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; line-height: 13px;
    color: var(--text-dim); background: var(--bg-surface); border: 1px solid var(--border-base);
  }

  /* ---------- 弹窗壳 ---------- */
  #overlay { transition: opacity .16s ease; }
  #modal { transition: transform .16s ease, opacity .16s ease; }
  #overlay.closing { opacity: 0; }
  #overlay.closing #modal { transform: scale(.98) translateY(4px); opacity: 0; }

  .dialog-shadow {
    border: 1px solid var(--border-base);
    box-shadow: 0 8px 20px -4px rgba(15, 23, 19, 0.10), 0 24px 48px -12px rgba(15, 23, 19, 0.14);
  }

  /* 分类 combobox 下拉 */
  #catDropdown { display: none; }
  #catDropdown.open { display: block; }
  .cat-opt { padding: 5px 9px; font-size: 12px; color: var(--text-main); border-radius: 5px; cursor: pointer; }
  .cat-opt:hover { background: var(--bg-sidebar); }

  /* 假背景列表 */
  .fake-card { height: 44px; border: 1px solid var(--border-card); border-radius: 8px; background: var(--bg-surface); display: flex; align-items: center; padding: 0 12px; gap: 10px; }
</style>
</head>
<body>

<!-- 底层假列表：让遮罩的“隐约可见”成立 -->
<div class="flex h-full">
  <aside class="w-[190px] shrink-0 border-r px-4 py-4" style="background: var(--bg-sidebar); border-color: var(--border-card);">
    <div class="mb-5 flex items-center gap-2">
      <div class="h-5 w-5 rounded-md" style="background: var(--brand);"></div>
      <span class="text-[13px] font-semibold">Desko</span>
    </div>
    <nav class="space-y-1 text-[12.5px]" style="color: var(--text-muted);">
      <div class="rounded-md px-2.5 py-1.5" style="background: rgba(33,103,71,.10); color: var(--brand); font-weight: 500;">网址收藏</div>
      <div class="px-2.5 py-1.5">小记</div>
      <div class="px-2.5 py-1.5">文件快捷</div>
      <div class="px-2.5 py-1.5">局域网传输</div>
    </nav>
  </aside>
  <main class="min-w-0 flex-1 px-6 py-4">
    <div class="mb-4 flex items-center justify-between">
      <h1 class="text-[15px] font-semibold">网址收藏</h1>
      <button id="reopen" class="btn-primary" style="height:30px;">＋ 新增条目</button>
    </div>
    <div class="space-y-2">
      <div class="fake-card"><span class="text-[13px] font-medium">GitHub</span><span class="mono text-[11.5px]" style="color:var(--text-dim)">github.com</span></div>
      <div class="fake-card"><span class="text-[13px] font-medium">Gmail</span><span class="mono text-[11.5px]" style="color:var(--text-dim)">mail.google.com</span></div>
      <div class="fake-card"><span class="text-[13px] font-medium">钉钉</span><span class="mono text-[11.5px]" style="color:var(--text-dim)">www.dingtalk.com</span></div>
    </div>
  </main>
</div>

<!-- ======================= 弹窗 ======================= -->
<div id="overlay" class="fixed inset-0 z-50 flex items-start justify-center bg-black/25 backdrop-blur-[2px]">
  <div id="modal" class="dialog-shadow mt-[7vh] w-[520px] max-w-[520px] overflow-hidden rounded-xl" style="background: var(--bg-surface);">

    <!-- 顶栏 42px -->
    <header class="flex h-[42px] items-center justify-between border-b px-5" style="border-color: var(--border-card);">
      <h2 class="text-[14px] font-semibold leading-none">新增网址收藏</h2>
      <button id="closeX" class="flex h-7 w-7 items-center justify-center rounded-md text-[14px] leading-none transition-colors hover:bg-[var(--bg-sidebar)]" style="color: var(--text-dim);" title="关闭">✕</button>
    </header>

    <!-- 表单主体：行距 12px + label 下距 6px，整体放一档呼吸感 -->
    <div class="flex flex-col gap-3 px-5 pt-4 pb-3">
      <!-- 行 1：名称 + 分类（1:1） -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label" for="fName">条目名称 <span class="req">*</span></label>
          <input id="fName" class="field-input" placeholder="例如：OA系统" />
        </div>
        <div class="relative">
          <label class="field-label" for="fCat">所属分类 <span class="req">*</span></label>
          <input id="fCat" class="field-input pr-7" placeholder="选择或输入" autocomplete="off" />
          <svg class="pointer-events-none absolute right-3 top-[30px] h-3.5 w-3.5" viewBox="0 0 12 12" fill="none" stroke="#7d9185" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
          <div id="catDropdown" class="absolute left-0 right-0 top-[58px] z-10 rounded-md border p-1" style="background: var(--bg-surface); border-color: var(--border-base); box-shadow: 0 6px 16px -6px rgba(15,23,19,.16);">
            <div class="cat-opt" data-cat="开发">开发</div>
            <div class="cat-opt" data-cat="办公">办公</div>
            <div class="cat-opt" data-cat="邮箱">邮箱</div>
          </div>
        </div>
      </div>

      <!-- 行 2：主机地址（通栏，等宽） -->
      <div>
        <label class="field-label" for="fHost">主机地址 <span class="req">*</span></label>
        <input id="fHost" class="field-input mono" placeholder="https://..." />
      </div>

      <!-- 行 3：用户名 + 密码（1:1，可选） -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="field-label" for="fUser">用户名</label>
          <input id="fUser" class="field-input" placeholder="登录用户名" />
        </div>
        <div>
          <label class="field-label" for="fPwd">密码</label>
          <input id="fPwd" class="field-input" type="password" placeholder="登录密码" />
        </div>
      </div>

      <!-- 行 4：子路径分支 · 固定物理槽（0↔N 条零抖动） -->
      <div>
        <div class="flex items-baseline justify-between" style="margin-bottom: 6px;">
          <span class="field-label mb-0">子路径分支</span>
          <span id="pathCount" class="text-[10.5px] leading-none" style="color: var(--text-dim);">0 个路径</span>
        </div>
        <div class="rounded-md border p-1.5" style="background: var(--bg-subtle); border-color: var(--border-base);">
          <div id="pathList" class="path-viewport">
            <div id="pathEmpty" class="flex h-full items-center justify-center text-[11.5px]" style="color: var(--text-dim);">暂无子路径分支</div>
          </div>
          <div class="mt-1 flex items-center gap-2 border-t pt-2" style="border-color: var(--border-card);">
            <input id="dLabel" class="field-input" style="width: 72px; min-width: 72px; flex-shrink: 0; height: 28px; font-size: 12px;" placeholder="标签" maxlength="12" />
            <span class="text-[11px]" style="color: var(--text-dim);">/</span>
            <input id="dPath" class="field-input mono flex-1" style="height: 28px; font-size: 12px; min-width: 0;" placeholder="dashboard" />
            <button id="btnAdd" class="btn-add">添加</button>
          </div>
        </div>
      </div>

      <!-- 行 5：备注（标签独立一行 + 两行 textarea，与其他字段同构） -->
      <div>
        <label class="field-label" for="fNotes">备注说明</label>
        <textarea id="fNotes" class="field-input" placeholder="可选"></textarea>
      </div>
    </div>

    <!-- 底栏 46px -->
    <footer class="flex h-[46px] items-center justify-between border-t px-5" style="background: var(--bg-subtle); border-color: var(--border-card);">
      <div class="flex items-center gap-1 text-[10px]" style="color: var(--text-dim);">
        <span class="kbd">Ctrl</span><span class="kbd">Enter</span><span>保存</span>
        <span class="mx-1">·</span>
        <span class="kbd">Esc</span><span>取消</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnCancel" class="btn-ghost">取消</button>
        <button id="btnSave" class="btn-primary">保存条目</button>
      </div>
    </footer>
  </div>
</div>

<div id="savedPill" class="fixed bottom-6 left-1/2 -translate-x-1/2 rounded-full px-4 py-1.5 text-[12px] opacity-0 transition-opacity duration-200" style="background: var(--brand); color: #f2f7f4;">已保存（原型演示）</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const overlay = $('#overlay'), modal = $('#modal');
  const nameEl = $('#fName'), catEl = $('#fCat'), hostEl = $('#fHost');
  const list = $('#pathList'), empty = $('#pathEmpty'), count = $('#pathCount');
  const dLabel = $('#dLabel'), dPath = $('#dPath');

  /* ---------- 子路径数据：固定槽位，增删只动视窗内部 ---------- */
  const paths = [];

  function render() {
    list.querySelectorAll('.path-row').forEach(r => r.remove());
    empty.style.display = paths.length ? 'none' : 'flex';
    paths.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'path-row';
      const chip = document.createElement('span');
      chip.className = 'path-chip';
      chip.textContent = p.label || '未命名';
      const sep = document.createElement('span');
      sep.className = 'text-[11px] shrink-0';
      sep.style.color = 'var(--text-dim)';
      sep.textContent = '/';
      const val = document.createElement('span');
      val.className = 'path-text mono';
      val.textContent = p.path;
      val.title = '/' + p.path;
      const del = document.createElement('button');
      del.className = 'path-del';
      del.title = '移除';
      del.textContent = '✕';
      del.addEventListener('click', () => { paths.splice(i, 1); render(); });
      row.append(chip, sep, val, del);
      list.appendChild(row);
    });
    count.textContent = paths.length + ' 个路径';
  }

  function addPath() {
    const raw = dPath.value.trim();
    if (!raw) { dPath.focus(); return; }
    paths.push({ label: dLabel.value.trim(), path: raw.replace(/^\/+/, '') });
    dLabel.value = ''; dPath.value = '';
    render();
    list.scrollTop = list.scrollHeight;
    dPath.focus();
  }
  $('#btnAdd').addEventListener('click', addPath);
  dPath.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPath(); } });
  dLabel.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); dPath.focus(); } });

  /* ---------- 分类 combobox：点选或回车即新建 ---------- */
  const dd = $('#catDropdown');
  catEl.addEventListener('focus', () => dd.classList.add('open'));
  catEl.addEventListener('blur', () => setTimeout(() => dd.classList.remove('open'), 150));
  catEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); dd.classList.remove('open'); clearInvalid(catEl); } });
  dd.querySelectorAll('.cat-opt').forEach(o =>
    o.addEventListener('mousedown', e => { e.preventDefault(); catEl.value = o.dataset.cat; dd.classList.remove('open'); clearInvalid(catEl); }));

  /* ---------- 必填校验：红框 + 无位移微光 + 聚焦 ---------- */
  function markInvalid(el) {
    el.classList.add('invalid');
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }
  function clearInvalid(el) { el.classList.remove('invalid', 'pulse'); }
  [nameEl, hostEl].forEach(el => el.addEventListener('input', () => clearInvalid(el)));
  catEl.addEventListener('input', () => clearInvalid(catEl));

  function save() {
    const first = [nameEl, catEl, hostEl].find(el => !el.value.trim());
    if (first) { markInvalid(first); first.focus(); return; }
    close();
    const pill = $('#savedPill');
    pill.style.opacity = '1';
    setTimeout(() => pill.style.opacity = '0', 1400);
  }
  $('#btnSave').addEventListener('click', save);

  /* ---------- 开合与全局键盘 ---------- */
  function open() {
    overlay.classList.remove('closing');
    overlay.style.display = 'flex';
    setTimeout(() => nameEl.focus(), 30);
  }
  function close() {
    overlay.classList.add('closing');
    setTimeout(() => { overlay.style.display = 'none'; overlay.classList.remove('closing'); }, 170);
  }
  $('#closeX').addEventListener('click', close);
  $('#btnCancel').addEventListener('click', close);
  $('#reopen').addEventListener('click', open);
  overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });

  window.addEventListener('keydown', e => {
    if (overlay.style.display === 'none') return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
  });

  render();
})();
</script>
</body>
</html>
