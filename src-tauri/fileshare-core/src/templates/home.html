<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>局域网文件传输 · Desko</title>
  <style>
    /* 尺度层：与 desko 主窗口 global.css 同源，主题间恒定 */
    :root {
      --r-sm: 6px; --r: 10px; --r-md: 12px; --r-xl: 14px; --r-pill: 99px;
      --t-xs: 12px; --t-sm: 13px; --t-base: 14px; --t-md: 15px;
      --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'HarmonyOS Sans SC', 'Microsoft YaHei UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono: Consolas, 'JetBrains Mono', monospace;
      --tr: .15s cubic-bezier(.4,0,.2,1);
    }
    @font-face {
      font-family: 'HarmonyOS Sans SC';
      src: url('/fonts/app.woff2') format('woff2-variations');
      font-weight: 40 900; font-style: normal; font-display: swap;
    }
    /* paper（暖纸 · 墨蓝）：desko 浅色缺省 */
    :root {
      --bg:#f7f6f4; --panel:#ffffff; --chrome:rgba(247,246,244,.78); --sunken:#f0efec; --fill:#e9e8e4; --hover:#faf9f7;
      --text:#37352f; --text2:#4f4e48; --muted:#6e6c64; --faint:#98968c;
      --border:#e9e8e4; --border-strong:#d8d6d1;
      --accent:#3d5a80; --accent-hover:#31496a; --accent-on:#fff; --accent-soft:#e8eef4; --text-brand:#31496a; --ring:rgba(61,90,128,.16);
      --shadow-card:0 1px 2px 0 rgba(29,28,26,.04);
      --shadow-pop:0 16px 36px -8px rgba(29,28,26,.12),0 4px 10px -2px rgba(29,28,26,.04),0 0 0 1px rgba(0,0,0,.06);
      --overlay:rgba(29,28,26,.42);
      --toast-bg:#26241f; --toast-fg:#f2f0ea; --toast-ok:#9cc4ae; --toast-er:#e09a92;
      --ft-doc:#4a6d9c; --ft-img:#9a5a72; --ft-arch:#6a5a99; --ft-vid:#a0603a; --ft-code:#8a7534; --ft-unk:#7a7f88;
      --success:#3d7355; --danger:#a9443c;
      --g1:#6c88aa; --g3:#283d58;
      --drag-veil:rgba(61,90,128,.06);
    }
    /* ink（暖墨）：跟随系统深色 */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#191816; --panel:#211f1c; --chrome:rgba(25,24,22,.85); --sunken:#131211; --fill:#2b2925; --hover:#292723;
        --text:#e9e8e5; --text2:#b5b4b0; --muted:#9d9c97; --faint:#7c7b76;
        --border:#33302b; --border-strong:#47433c;
        --accent:#7d9fc6; --accent-hover:#96b3d4; --accent-on:#171614; --accent-soft:rgba(125,159,198,.16); --text-brand:#a8c3e0; --ring:rgba(125,159,198,.32);
        --shadow-card:inset 0 1px 0 rgba(255,255,255,.04);
        --shadow-pop:0 24px 54px -12px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.08);
        --overlay:rgba(0,0,0,.62);
        --toast-bg:#ecebe6; --toast-fg:#1d1c1a; --toast-ok:#2f7d52; --toast-er:#b23c37;
        --ft-doc:#7aa2f7; --ft-img:#e08bb8; --ft-arch:#a98be8; --ft-vid:#e0a45c; --ft-code:#e0c060; --ft-unk:#6b7280;
        --success:#6fbf95; --danger:#e08079;
        --g1:#a8c3e0; --g3:#5c7ea6;
        --drag-veil:rgba(125,159,198,.08);
      }
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; font:var(--t-base)/1.5 var(--font-ui); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    button { font-family:inherit; cursor:pointer; }
    svg { display:block; }

    /* 顶栏 48px 磨砂 */
    .topbar { position:sticky; top:0; z-index:50; height:48px; display:flex; align-items:center; gap:10px; padding:0 20px;
      background:var(--chrome); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    .brand { width:22px; height:22px; border-radius:var(--r-sm); background:linear-gradient(135deg,var(--g1),var(--g3)); display:grid; place-items:center;
      color:#fff; font:800 11px/1 var(--font-mono); flex-shrink:0; }
    .topbar h1 { font:600 var(--t-md)/1 var(--font-ui); letter-spacing:-.01em; white-space:nowrap; }
    .spacer { flex:1; }
    .url-chip { font:11px/1 var(--font-mono); color:var(--muted); background:var(--sunken); border-radius:var(--r-sm); padding:5px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw; }
    .btn { height:28px; display:inline-flex; align-items:center; gap:5px; padding:0 10px; font:500 var(--t-sm)/1 var(--font-ui);
      color:var(--text2); background:var(--panel); border:1px solid var(--border); border-radius:var(--r-sm); transition:all var(--tr); }
    .btn:hover { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-on); }
    .btn.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); color:var(--accent-on); }
    .btn.icon { width:28px; padding:0; justify-content:center; background:transparent; border-color:transparent; color:var(--muted); }
    .btn.icon:hover { background:var(--hover); color:var(--text); border-color:transparent; }

    /* 内容列：浏览型表格页，随视口流式放大，1200px 封顶 */
    .wrap { max-width:1200px; margin:0 auto; padding:16px 24px 96px; }

    /* 工具条：浮在灰底上，不进面板 */
    .toolbar { display:flex; align-items:center; gap:8px; }
    .search { position:relative; width:280px; max-width:52%; }
    .search svg { position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--faint); }
    .search input { width:100%; height:30px; padding:0 10px 0 30px; font:var(--t-xs)/1 var(--font-ui); color:var(--text);
      background:var(--panel); border:1px solid var(--border); border-radius:8px; outline:none; box-shadow:var(--shadow-card); transition:border-color var(--tr), box-shadow var(--tr); }
    .search input::placeholder { color:var(--faint); }
    .search input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
    .count { font:var(--t-xs)/1 var(--font-ui); color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }

    /* 列表面板：inset 白面 + 发丝分行 */
    .panel { margin-top:12px; background:var(--panel); border:1px solid var(--border); border-radius:var(--r-xl); box-shadow:var(--shadow-card); overflow:hidden; }
    .file-list { display:flex; flex-direction:column; }
    .row { display:grid; grid-template-columns:28px minmax(0,1fr) 84px 148px 32px; gap:12px; align-items:center; height:52px; padding:0 16px; transition:background var(--tr); }
    .row + .row { border-top:1px solid var(--border); }
    .row:hover { background:var(--hover); }
    .fico { width:28px; height:28px; border-radius:var(--r-sm); background:var(--sunken); display:grid; place-items:center; flex-shrink:0; }
    .fico.doc { color:var(--ft-doc); } .fico.img { color:var(--ft-img); } .fico.zip { color:var(--ft-arch); }
    .fico.vid { color:var(--ft-vid); } .fico.code { color:var(--ft-code); } .fico.default { color:var(--ft-unk); }
    .fmain { min-width:0; }
    .fname { font:500 var(--t-base)/1.35 var(--font-ui); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fpath { font:var(--t-xs)/1.35 var(--font-mono); color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fsize { font:var(--t-xs)/1 var(--font-mono); color:var(--text2); text-align:right; font-variant-numeric:tabular-nums; }
    .fdate { font:var(--t-xs)/1 var(--font-mono); color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .fdl { width:28px; height:28px; border-radius:var(--r-sm); color:var(--faint); display:grid; place-items:center; opacity:0; transition:all var(--tr); }
    .row:hover .fdl { opacity:1; }
    .row:hover .fdl { color:var(--accent); }

    /* 滚动续加：面板底部哨兵行，加载时转圈，全部到齐即消失 */
    .more { display:flex; align-items:center; justify-content:center; gap:8px; height:40px; border-top:1px solid var(--border);
      font:var(--t-xs)/1 var(--font-ui); color:var(--faint); }
    .spin { width:12px; height:12px; border-radius:50%; border:1.5px solid var(--border-strong); border-top-color:var(--accent); animation:rot .7s linear infinite; }
    @keyframes rot { to { transform:rotate(360deg); } }

    /* 空态 */
    .empty { text-align:center; padding:44px 20px; }
    .empty-ico { width:40px; height:40px; border-radius:50%; background:var(--sunken); color:var(--faint); display:grid; place-items:center; margin:0 auto 10px; }
    .empty-t { display:block; font:500 var(--t-base)/1.4 var(--font-ui); color:var(--text2); }
    .empty-d { font:var(--t-sm)/1.6 var(--font-ui); color:var(--faint); }

    /* toast：深色字面片 */
    .toast { position:fixed; top:60px; right:20px; z-index:200; display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:8px;
      background:var(--toast-bg); color:var(--toast-fg); font:500 var(--t-sm)/1 var(--font-ui); box-shadow:var(--shadow-pop); }
    .toast::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--toast-ok); flex-shrink:0; }

    /* 弹窗：desko dialog 基线（分段凹槽 + 46px 底栏 28px 钮） */
    .modal-bg { position:fixed; inset:0; z-index:150; background:var(--overlay); display:none; place-items:center; padding:20px; }
    .modal-bg.on { display:grid; }
    .modal { width:480px; max-width:100%; background:var(--panel); border:1px solid var(--border); border-radius:var(--r-xl); box-shadow:var(--shadow-pop); overflow:hidden; }
    .m-head { display:flex; align-items:center; gap:8px; padding:14px 20px 0; }
    .m-title { font:600 var(--t-md)/1 var(--font-ui); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .m-head .btn.icon { margin-left:auto; flex-shrink:0; }
    .m-body { padding:14px 20px 18px; }
    .seg { display:flex; gap:2px; padding:2px; background:var(--sunken); border-radius:8px; margin-bottom:14px; }
    .seg button { flex:1; height:28px; border:none; background:transparent; border-radius:var(--r-sm);
      font:500 var(--t-sm)/1 var(--font-ui); color:var(--muted); transition:all var(--tr); }
    .seg button.on { background:var(--panel); color:var(--text); box-shadow:var(--shadow-card); }
    .drop { border:1.5px dashed var(--border-strong); border-radius:var(--r); background:var(--sunken); padding:26px 18px; text-align:center; cursor:pointer; transition:all var(--tr); }
    .drop:hover, .drop.ov { border-color:var(--accent); background:var(--accent-soft); }
    .drop-ico { width:36px; height:36px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; margin:0 auto 8px; }
    .drop-t { font:var(--t-sm)/1.5 var(--font-ui); color:var(--text2); }
    .drop-t b { font-weight:500; color:var(--text-brand); }
    .drop-sub { font:var(--t-xs)/1.5 var(--font-ui); color:var(--faint); }
    .field { width:100%; height:32px; padding:0 10px; font:var(--t-sm)/1 var(--font-ui); color:var(--text); background:var(--panel);
      border:1px solid var(--border); border-radius:var(--r-sm); outline:none; margin-bottom:8px; transition:border-color var(--tr), box-shadow var(--tr); }
    .field:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
    .field::placeholder, .modal-ta::placeholder { color:var(--faint); }
    .modal-ta { width:100%; min-height:96px; padding:8px 10px; font:12.5px/1.6 var(--font-mono); color:var(--text); background:var(--panel);
      border:1px solid var(--border); border-radius:var(--r-sm); outline:none; resize:vertical; scrollbar-gutter:stable; transition:border-color var(--tr), box-shadow var(--tr); }
    .modal-ta:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--ring); }
    .m-foot { display:flex; align-items:center; justify-content:flex-end; gap:8px; min-height:46px; padding:0 20px; border-top:1px solid var(--border); position:relative; }
    .m-foot .st { margin-right:auto; font:var(--t-xs)/1 var(--font-ui); color:var(--muted); }
    .m-foot .st.ok { color:var(--success); } .m-foot .st.er { color:var(--danger); }
    .modal-pg { height:3px; background:var(--border); border-radius:2px; margin-bottom:10px; overflow:hidden; display:none; }
    .modal-pg.on { display:block; }
    .modal-pg i { display:block; height:100%; background:var(--accent); width:0; transition:width .15s; }
    .st-label { font:var(--t-xs)/1.5 var(--font-ui); color:var(--muted); margin:10px 0 6px; }
    .st-label:first-child { margin-top:0; }
    .dir-row { display:flex; align-items:center; gap:8px; min-height:32px; padding:0 10px; margin-bottom:6px; background:var(--sunken); border-radius:var(--r-sm);
      font:var(--t-xs)/1 var(--font-mono); color:var(--text2); word-break:break-all; }
    .dir-row svg { color:var(--accent); flex-shrink:0; }

    .drag-overlay { position:fixed; inset:0; z-index:300; background:var(--drag-veil); border:2px dashed var(--accent); display:none; place-items:center; pointer-events:none; }
    .drag-overlay.on { display:grid; }
    .drag-overlay-t { font:700 var(--t-md)/1 var(--font-ui); color:var(--accent); padding:16px 28px; background:var(--panel); border-radius:var(--r-md); box-shadow:var(--shadow-pop); }

    @media (max-width:640px) {
      .topbar { padding:0 14px; } .topbar h1 { font-size:var(--t-base); } .url-chip { display:none; }
      .wrap { padding:12px 12px 88px; }
      .search { width:auto; flex:1; max-width:none; }
      .count { display:none; }
      .btn.primary .lbl { display:none; } .btn.primary { width:30px; padding:0; justify-content:center; }
      .row { grid-template-columns:26px minmax(0,1fr) 32px; height:56px; padding:0 12px; gap:10px; }
      .fsize, .fdate { display:none; }
      .fdl { opacity:1; }
      .modal { width:100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">D</div>
    <h1>局域网文件传输</h1>
    <span class="spacer"></span>
    <a class="url-chip" href="%%LAN_URL%%">%%LAN_URL%%</a>
    <button class="btn" id="btn-settings" type="button">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </button>
  </header>

  <main class="wrap">
    %%TOAST%%
    <div class="toolbar">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="搜索文件名…" id="file-search" value="%%SEARCH_Q%%">
      </div>
      <span class="count" id="file-count">%%COUNT%%</span>
      <span class="spacer"></span>
      <button class="btn primary" id="btn-upload" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="lbl">上传</span>
      </button>
    </div>

    <section class="panel">
      <div class="file-list" id="file-list">
%%ROWS%%
      </div>
    </section>
  </main>

  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <div class="m-head">
        <span class="m-title">上传到 %%UPLOAD_DIR%%</span>
        <button class="btn icon" id="modal-close" type="button" title="关闭">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="seg">
        <button type="button" class="on" data-pane="file">上传文件</button>
        <button type="button" data-pane="text">保存为文本</button>
      </div>
      <form id="upl-form" data-pane-body="file" action="/upload?share=%%SHARE_INDEX%%" method="post" enctype="multipart/form-data">
        <div class="m-body">
          <input id="upl" type="file" name="files" multiple hidden>
          <div class="drop" id="drop">
            <div class="drop-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
            <div class="drop-t" id="drop-t">拖放文件到这里，或<b>点击选择</b></div>
            <div class="drop-sub">支持多文件同时上传</div>
          </div>
        </div>
        <div class="m-foot">
          <span class="st" id="upl-st"></span>
          <div class="modal-pg" id="upl-pg" style="position:absolute;left:20px;right:20px;top:-7px;width:auto"><i id="upl-fill"></i></div>
          <button class="btn primary" type="submit">上传</button>
        </div>
      </form>
      <form id="txt-form" data-pane-body="text" action="/save-text?share=%%SHARE_INDEX%%" method="post" hidden>
        <div class="m-body">
          <input class="field" name="filename" type="text" placeholder="文件名（自动补 .txt）">
          <textarea class="modal-ta" name="content" placeholder="粘贴或输入要传过去的文本…"></textarea>
        </div>
        <div class="m-foot">
          <span class="st" id="txt-st"></span>
          <button class="btn primary" type="submit">保存文本</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-bg" id="settings-bg">
    <div class="modal">
      <div class="m-head">
        <span class="m-title">共享目录</span>
        <button class="btn icon" id="settings-close" type="button" title="关闭">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="m-body">
        <div class="st-label">当前共 %%DIR_COUNT%% 个目录，第一个为上传目标</div>
        <div class="dir-list">
%%DIR_ITEMS%%
        </div>
        <form id="set-form" action="/settings" method="post">
          <div class="st-label">每行一个目录路径，保存后立即生效，无需重启服务</div>
          <textarea class="modal-ta" name="share_dirs" placeholder="例如：&#10;D:\share\docs&#10;/srv/share/media">%%DIRS_TEXTAREA%%</textarea>
        </form>
      </div>
      <div class="m-foot">
        <span class="st" id="set-st"></span>
        <button class="btn" id="settings-cancel" type="button">取消</button>
        <button class="btn primary" form="set-form" type="submit">保存设置</button>
      </div>
    </div>
  </div>

  <div class="drag-overlay" id="drag-overlay">
    <div class="drag-overlay-t">释放以上传文件</div>
  </div>

  <script>
    (function(){
      var SEP = '\n---PARTIAL---\n';
      var toast = document.querySelector('.toast');
      if (toast) setTimeout(function(){ toast.remove(); }, 3000);

      /* ---- 弹窗开合 + 分段页签 ---- */
      var modalBg = document.getElementById('modal-bg');
      var setBg = document.getElementById('settings-bg');
      function closeModals(){ modalBg.classList.remove('on'); setBg.classList.remove('on'); }
      document.getElementById('btn-upload').addEventListener('click', function(){ modalBg.classList.add('on'); });
      document.getElementById('btn-settings').addEventListener('click', function(){ setBg.classList.add('on'); });
      document.getElementById('modal-close').addEventListener('click', closeModals);
      document.getElementById('settings-close').addEventListener('click', closeModals);
      document.getElementById('settings-cancel').addEventListener('click', closeModals);
      [modalBg, setBg].forEach(function(bg){
        bg.addEventListener('click', function(e){ if (e.target === bg) closeModals(); });
      });
      document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModals(); });
      var segBtns = modalBg.querySelectorAll('.seg button');
      function showPane(name){
        segBtns.forEach(function(b){ b.classList.toggle('on', b.dataset.pane === name); });
        modalBg.querySelectorAll('form[data-pane-body]').forEach(function(f){ f.hidden = f.dataset.paneBody !== name; });
      }
      segBtns.forEach(function(b){ b.addEventListener('click', function(){ showPane(b.dataset.pane); }); });

      /* ---- 列表：搜索替换 + 滚动续加 ---- */
      var searchInput = document.getElementById('file-search');
      var fileList = document.getElementById('file-list');
      var fileCount = document.getElementById('file-count');
      var loading = false;

      function partialUrl(q, page){
        var p = new URLSearchParams();
        if (q) p.set('q', q);
        if (page > 1) p.set('page', String(page));
        p.set('partial', '1');
        return '/?' + p;
      }
      function fetchPartial(q, page, done){
        var x = new XMLHttpRequest();
        x.open('GET', partialUrl(q, page));
        x.onload = function(){
          if (x.status < 200 || x.status >= 400) { done(null); return; }
          var t = x.responseText, sep = t.indexOf(SEP);
          if (sep < 0) { done(null); return; }
          var d = document.createElement('div');
          d.innerHTML = t.substring(sep + SEP.length);
          done({ count: t.substring(0, sep), frag: d });
        };
        x.onerror = function(){ done(null); };
        x.send();
      }
      function applyResult(res, replace){
        if (!res) return;
        fileCount.textContent = res.count;
        var rows = res.frag.querySelectorAll('.row, .empty');
        var more = res.frag.querySelector('.more');
        var old = fileList.querySelector('.more');
        if (replace) { fileList.textContent = ''; old = null; }
        rows.forEach(function(r){ fileList.insertBefore(r, old); });
        if (old) old.remove();
        if (more) fileList.appendChild(more);
        observeMore();
      }
      function loadMore(){
        var el = fileList.querySelector('.more');
        if (!el || loading) return;
        loading = true;
        el.innerHTML = '<span class="spin"></span>加载中…';
        fetchPartial(el.dataset.q || '', parseInt(el.dataset.page, 10) || 2, function(res){
          loading = false;
          if (res) applyResult(res, false);
          else { el.innerHTML = '加载失败，点击重试'; el.addEventListener('click', loadMore, { once:true }); }
        });
      }
      var io = null;
      function observeMore(){
        var el = fileList.querySelector('.more');
        if (io) io.disconnect();
        if (!el || !('IntersectionObserver' in window)) return;
        io = new IntersectionObserver(function(entries){
          if (entries.some(function(e){ return e.isIntersecting; })) loadMore();
        }, { rootMargin: '240px' });
        io.observe(el);
      }
      var timer = null;
      searchInput.addEventListener('input', function(){
        clearTimeout(timer);
        timer = setTimeout(function(){
          fetchPartial(searchInput.value.trim(), 1, function(res){ if (res) applyResult(res, true); });
        }, 300);
      });
      observeMore();

      /* ---- 共享目录设置 ---- */
      var setForm = document.getElementById('set-form');
      var setSt = document.getElementById('set-st');
      setForm.addEventListener('submit', function(e){
        e.preventDefault();
        var btn = setForm.querySelector('button'), orig = btn.innerHTML;
        btn.disabled = true; btn.textContent = '保存中...';
        setSt.className = 'st'; setSt.textContent = '保存中...';
        var x = new XMLHttpRequest();
        x.addEventListener('load', function(){
          btn.disabled = false; btn.innerHTML = orig;
          if (x.status >= 200 && x.status < 400) { location.href = x.responseURL || '/'; }
          else {
            setSt.className = 'st er';
            var msg = (x.responseText || '').trim();
            setSt.textContent = (msg && msg.charAt(0) !== '<' ? msg.slice(0, 120) : '保存失败');
          }
        });
        x.addEventListener('error', function(){ btn.disabled = false; btn.innerHTML = orig; setSt.className = 'st er'; setSt.textContent = '网络异常'; });
        x.open('POST', setForm.action);
        x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded;charset=UTF-8');
        x.send(new URLSearchParams(new FormData(setForm)).toString());
      });

      /* ---- 上传 ---- */
      var uplForm = document.getElementById('upl-form');
      var uplInput = document.getElementById('upl');
      var drop = document.getElementById('drop');
      var dropT = document.getElementById('drop-t');
      var uplPg = document.getElementById('upl-pg');
      var uplFill = document.getElementById('upl-fill');
      var uplSt = document.getElementById('upl-st');
      drop.addEventListener('click', function(){ uplInput.click(); });
      ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('ov'); }); });
      ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('ov'); }); });
      function pickedNames(files){ var n=[]; for(var i=0;i<files.length;i++) n.push(files[i].name); return n; }
      uplInput.addEventListener('change', function(){
        if (uplInput.files.length) dropT.innerHTML = '已选择 <b>' + pickedNames(uplInput.files).map(escapeHtml).join('、') + '</b>';
      });
      function escapeHtml(s){ var d = document.createElement('span'); d.textContent = s; return d.innerHTML; }
      function doUpload(){
        if (!uplInput.files.length) return;
        uplSt.className = 'st'; uplSt.textContent = '上传中...';
        uplPg.classList.add('on'); uplFill.style.width = '0';
        var x = new XMLHttpRequest();
        x.upload.addEventListener('progress', function(e){ if(e.lengthComputable) uplFill.style.width = Math.round(e.loaded*100/e.total)+'%'; });
        x.addEventListener('load', function(){
          uplPg.classList.remove('on');
          if (x.status >= 200 && x.status < 400) { uplSt.className = 'st ok'; uplSt.textContent = '上传完成'; setTimeout(function(){ location.reload(); }, 600); }
          else { uplSt.className = 'st er'; uplSt.textContent = '上传失败'; }
        });
        x.addEventListener('error', function(){ uplPg.classList.remove('on'); uplSt.className = 'st er'; uplSt.textContent = '网络异常'; });
        x.open('POST', uplForm.action);
        x.send(new FormData(uplForm));
      }
      uplForm.addEventListener('submit', function(e){ e.preventDefault(); doUpload(); });

      /* ---- 文本保存 ---- */
      var txtForm = document.getElementById('txt-form');
      var txtSt = document.getElementById('txt-st');
      txtForm.addEventListener('submit', function(e){
        e.preventDefault();
        var btn = txtForm.querySelector('button[type=submit]'), orig = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = '保存中...';
        txtSt.className = 'st'; txtSt.textContent = '保存中...';
        var x = new XMLHttpRequest();
        x.addEventListener('load', function(){
          btn.disabled = false; btn.innerHTML = orig;
          if (x.status >= 200 && x.status < 400) { txtSt.className = 'st ok'; txtSt.textContent = '已保存'; setTimeout(function(){ location.reload(); }, 600); }
          else { txtSt.className = 'st er'; txtSt.textContent = '保存失败'; }
        });
        x.addEventListener('error', function(){ btn.disabled = false; btn.innerHTML = orig; txtSt.className = 'st er'; txtSt.textContent = '网络异常'; });
        x.open('POST', txtForm.action);
        x.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded;charset=UTF-8');
        x.send(new URLSearchParams(new FormData(txtForm)).toString());
      });

      /* ---- 全页拖放 ---- */
      var overlay = document.getElementById('drag-overlay');
      var dragCount = 0;
      document.addEventListener('dragenter', function(e){ e.preventDefault(); dragCount++; overlay.classList.add('on'); });
      document.addEventListener('dragleave', function(e){ e.preventDefault(); dragCount--; if(dragCount<=0){ dragCount=0; overlay.classList.remove('on'); }});
      document.addEventListener('dragover', function(e){ e.preventDefault(); });
      document.addEventListener('drop', function(e){
        e.preventDefault(); dragCount=0; overlay.classList.remove('on');
        if (e.dataTransfer.files.length) {
          uplInput.files = e.dataTransfer.files;
          dropT.innerHTML = '已选择 <b>' + pickedNames(e.dataTransfer.files).map(escapeHtml).join('、') + '</b>';
          showPane('file');
          modalBg.classList.add('on');
          doUpload();
        }
      });
    })();
  </script>
</body>
</html>
