[package]
name = "fileshare-core"
version = "1.0.0"
edition = "2021"
description = "desko 局域网文件传输服务（独立进程）"

[[bin]]
name = "desko-fileshare"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
ureq = "2"
