[package]
name = "codex-core"
# 与上游 src-tauri 的版本串保持一致：keeper 代码里的身份头用 env!("CARGO_PKG_VERSION")
# 拼 `Codex Desktop/{version}`，填 0.1.0 会发出一个上游从未发过的版本形态。上游当前 v1.3.66。
version = "1.3.66"
edition = "2021"
description = "Codex 账号管理与切换（移植自 jlcodes99/cockpit-tools 裁剪版）"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.20"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
base64 = "0.22"
sha2 = "0.10"
fs2 = "0.4"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "rand_core"] }
url = "2.5"
rand = "0.8"
futures = "0.3"
futures-util = "0.3"
sysinfo = "0.33"
md5 = "0.7"
tiny_http = "0.12"
urlencoding = "2.1"
lazy_static = "1.5"
aes-gcm = "0.10"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2"
tracing-log = "0.2"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "zstd", "stream", "socks", "blocking"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "windows")'.dependencies]
age = { version = "0.11", default-features = false }
keyring = { version = "3.6", features = ["windows-native"] }
tempfile = "3"
junction = "2.0"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lib]
name = "codex_core"
crate-type = ["lib"]
